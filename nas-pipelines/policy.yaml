families:
  exclude_hard:
  - id: SYS-01
    name: synology_system_and_services
    patterns:
    - (^|/)\@eaDir(/|$)
    - (^|/)\#recycle(/|$)
    - (^|/)@tmp(/|$)
    - (^|/)PlexMediaServer(/|$)
    - (^|/)docker(/|$)
    - (^|/)ActiveBackupforBusiness(/|$)
    - (^|/)NetBackup(/|$)
    - (^|/)HomeAssistantPiCM4Backup(/|$)
    - (^|/)truth(/|$)
    - (^|/)staging(/|$)
  - id: DRV-01
    name: synology_drive_internal
    patterns:
    - (^|/)homes/[^/]+/Drive/\.SynologyDrive(/|$)
  exclude_soft:
  - id: SA-01
    name: storage_analyzer
    patterns:
    - (^|/)homes/[^/]+/Drive/Storage (Analyser|Analyzer) Logs(/|$)
  - id: GIT-01
    name: git_dirs
    patterns:
    - (^|/)\.git(/|$)
  - id: BUILD-01
    name: build_trees
    patterns:
    - (^|/)(build|dist|out|target|node_modules|__pycache__)(/|$)
  - id: TM-01
    name: timemachine_backups
    patterns:
    - (^|/)[A-Za-z0-9._-]+_TimeMachine(/|$)
  - id: TAKEOUT-01
    name: google_takeout_archives
    patterns:
    - (^|/)(Google[ _-]?Takeout|Google Photos Takeout|Takeout/Google Photos)(/|$)
    - (^|/).*/Takeout(/|$)
  - id: FRIG-01
    name: frigate_media
    patterns:
    - (^|/)video/frigate(/|$)
    - (^|/)video/frigate/(clips|recordings|exports|snapshots)(/|$)
  - id: MEDIA-NOISE
    name: generic_media_noise
    patterns:
    - (?i)(^|/)\.eclipse(/|$)
    - (?i)(^|/)\.android(/|$)
    - (?i)(^|/)\.dia(/|$)
    - (?i)(^|/)android(/|$)
    - (?i)(^|/)(cache|caches|tmp|temp)(/|$)
    - (?i)(^|/)(download|downloads)(/|$)
    - (?i)(^|/)(instagram|facebook)(/|$)
    - (?i)(^|/)(gnuradio|gnuradio[-_ ]companion)(/|$)
    - (?i)(^|/)(thumbnail|thumbnails|\.thumb|\.thumbnails)(/|$)
    - (?i)(^|/)(export|exports|edited|preview|previews|transcod(e|ed|ing))(/|$)
    - (^|/)WhatsApp/Media/.*/Sent(/|$)
    - (?i)(^|/)[^/]*(thumb|thumbnail|preview|edited)[^/]*\.(jpg|jpeg|png|gif|webp|heic|heif|tif|tiff|mp4|mov|m4v|mkv|avi|webm)(/|$)
    - (?i)(^|/)web_packages(/|$)
    - (?i)(^|/)homes/[^/]+/Drive/Archives/FFLY4U(/|$)
