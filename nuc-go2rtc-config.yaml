# -------------------------------------------------------------------------
# go2rtc.yaml (annotated)
# -------------------------------------------------------------------------
# This stand‑alone go2rtc instance pulls RTSP from ring‑mqtt (:8554 inside its
# container) and proxies each stream back out on host port 8556.
#
#  • *_detect  – low‑latency copy used by Frigate for motion / AI inference
#  • *_record  – high‑bitrate copy (plus optional transcode) for recording
#
#  Any 'ffmpeg:hwaccel=vaapi' line tells go2rtc to transcode using the NUC's
#  Intel iGPU when that profile is requested (i.e. by Frigate 'record' role).
# -------------------------------------------------------------------------

log:
  level: info                  # 2026-05-28: changed from debug to reduce log volume

api:
  listen: :1984                # container port; mapped to host 1985
  origin: '*'                  # allow any Origin header in browser UI

rtsp:
  listen: :8554                # container port; mapped to host 8556
  username: go2rtc             # must match ring‑mqtt LIVESTREAM_USER/PASS
  password: go2rtc

ffmpeg:
  bin: /usr/bin/ffmpeg         # system ffmpeg inside the image

streams:

  reolink_duo_allee_cote_main:
    - rtsp://admin:fG-56lui@192.168.50.129:8554/h264Preview_01_main
    - ffmpeg:rtsp_transport=tcp
    - ffmpeg:cache=30        # 2026-05-28: reduced from 120s to 30s
  reolink_duo_allee_cote_sub:
    - rtsp://admin:fG-56lui@192.168.50.129:8554/h264Preview_01_sub
    - ffmpeg:rtsp_transport=tcp
    - ffmpeg:cache=30        # 2026-05-28: reduced from 120s to 30s
