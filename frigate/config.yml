    # --- SNAPSHOTS --------------------------------------------------------
    snapshots:
      enabled: true             # Use global settings (retain person snaps)

    # --- ZONES -----------------------------------------------------------
    #  Full frame detection – if someone is in frame, they’re in the pool area
    zones:
      prive:
        coordinates: 
