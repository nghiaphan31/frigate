# -------------------------------------------------------------------------
# Frigate config.yml (annotated)
# -------------------------------------------------------------------------
# Frigate = NVR & real‑time object detection
# This file is fully self‑contained and ready to drop into ./frigate/config.yml
# -------------------------------------------------------------------------
#  • MQTT section          – connection to Home‑Assistant broker for events
#  • FFmpeg hw‑accel       – tells Frigate to use Intel VA‑API decode on the NUC
#  • Record block          – controls clip retention (adjust to match disk size)
#  • Detectors             – CPU only for now (add Coral or GPU if available)
#  • Cameras               – each Ring stream appears twice:
#                               * *_detect  :  low‑bitrate, low‑resolution feed
#                               * *_record  :  full‑resolution feed for archiving
# -------------------------------------------------------------------------

mqtt:
  host: 192.168.1.24                # same broker ring‑mqtt uses
  user: mosquito
  password: mosquito
  topic_prefix: frigate             # rename if you want multiple Frigate instances

ffmpeg:
  # Use the NUC's iGPU for H.264 decode; keep preset‑vaapi unless you add NVIDIA
  hwaccel_args: preset-vaapi
  output_args:
    # Copy video as-is and transcode the audio to AAC so every browser can play it
    record: preset-record-generic-audio-aac
record:
  enabled: true
  retain:
    days: 3                         # How long to keep motion clips
    mode: motion                    # 'all' records 24/7; uses much more disk 

# --- top-level (same level as mqtt:, ffmpeg:, record:, etc.) ----------
snapshots:
  enabled: true            # master switch
  timestamp: true          # print date/time on the image
  bounding_box: true       # draw the red box around the person
  clean_copy: false        # keep the annotated copy (don’t overwrite it with a “clean” PNG)
  crop: false              # set true if you want only the box area
  retain:                  # housekeeping
    default: 0             # keep *non-person* shots 0 d (you track only person anyway)
    objects:
      person: 7            # keep person snaps 7 days
# ---------------------------------------------------------------------

objects:
  track:
    - person
  filters:
    person:
      min_score: 0.72      # Only consider detections with confidence ≥ 0.72
      threshold: 0.72      # Require sustained confidence ≥ 0.72 to trigger event

detectors:
  cpu1:
    type: cpu                       # Change to 'edgetpu' if you add a Coral USB

cameras:
# ----------------------------------------------------------------------
# Camera: allee_sur_le_cote
# ----------------------------------------------------------------------
  allee_sur_le_cote:
    # Audio
    audio:
      enabled: true

    # Streams (RTSP input for detection and recording)
    ffmpeg:
      inputs:
        # Detect stream – low bitrate/resolution for efficient detection
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/allee_sur_le_cote_detect
          roles: [detect]
        # Record stream – high quality for storage
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/allee_sur_le_cote_record
          roles: [record, audio]

    mqtt:
      enabled: true          # optional—overrides the global default
      timestamp: true        # burn timestamp on MQTT snapshot
      bounding_box: true     # draw box + label + score + area
      crop: false

    # Detection configuration
    detect:
      width: 1280
      height: 720
      fps: 5

    # ----------------------------------------------------------------------
    # Per-camera detection object settings override (applies ONLY to this camera)
    # This completely replaces any global 'objects:' config for allee_sur_le_cote.
    objects:
      # Only track 'person' objects on this camera:
      track:
        - person
      filters:
        person:
          # Only recognize detections with at least this confidence score:
          min_score: 0.51     # Ignore detections below 0.51 confidence
          # Require the detection to sustain this confidence to fire an event:
          threshold: 0.6     # Event triggers only when confidence remains ≥ 0.6
    # ----------------------------------------------------------------------

    # Snapshots (enable snapshots and use defaults from the top-level snapshots block)
    snapshots:
      enabled: true

    # Motion zones
    zones:
      # "prive" zone:
      # - Defines a polygonal area on the image (see coordinates).
      # - loitering_time: 0 → An alert can trigger immediately when a person enters this zone.
      # - inertia: 3 → Event persists for 3 seconds after the person leaves the zone.
      # - objects: person → Only 'person' objects are considered for this zone.
      prive:
        coordinates: 
          0.276,1,0.342,0.464,0.063,0.412,0.059,0.397,0.065,0.376,0.053,0.35,0.063,0.34,0.129,0.305,0.229,0.269,0.353,0.249,0.47,0.241,0.6,0.238,0.69,0.248,0.815,0.273,0.886,0.292,0.975,0.34,1,0.35,0.999,0.996
        loitering_time: 0
        inertia: 3
        objects: person
      # "rodage" zone:
      #   - Polygon area defined below.
      #   - loitering_time: 10 → 'Person' must be in the zone for at least 10 seconds to trigger.
      #   - inertia: Event persists for 3 seconds after last detection leaves.
      #   - objects: Only 'person' will trigger zone events.
      rodage:
        coordinates: 0.062,0.424,0.331,0.482,0.266,0.998,0,0.994
        loitering_time: 10
        inertia: 3
        objects: person

    # Review/alert requirements
    review:
      alerts:
        required_zones: prive
      detections:
        required_zones: rodage
# ----------------------------------------------------------------------
# END Camera: allee_sur_le_cote
# ----------------------------------------------------------------------    

