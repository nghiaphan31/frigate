# ============================================================================
# 3. ADVANCED FEATURES AND MISCELLANEOUS
# ============================================================================
version: 0.15-1               # Frigate config versioning (leave as‑is)

semantic_search:
  enabled: true               # Enable trial feature for faster clip search
  reindex: false              # True ➜ force rebuild of vector DB on startup
  model_size: small           # Options: small | medium | large – GPU RAM required

