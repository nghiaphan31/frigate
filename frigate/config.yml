mqtt:
  host: 192.168.1.24
  user: mosquito
  password: mosquito

record:
  enabled: true
  retain:
    days: 3
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30

detect:
  enabled: true

snapshots:
  enabled: true
  retain:
    default: 7


ffmpeg:
  input_args: preset-rtsp-restream   # good for go2rtc / ring-mqtt
  retry_interval: 30                 # wait 30 s before reconnect
  # hwaccel_args: preset-intel-qsv   # uncomment if you have an iGPU

cameras:

  camera_allee_sur_le_cote:
    ffmpeg:
      inputs:
        - path: rtsp://frigate:frigate@192.168.1.24:8554/0cb2b74df743_live
          roles: [detect, record]
    detect: {width: 1920, height: 1080, fps: 5}

  camera_jardin_devant:
