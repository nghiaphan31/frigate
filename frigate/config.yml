  camera_allee_sur_le_cote:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/allee_sur_le_cote
          roles: [detect, record]
    detect:
      width: 1920
      height: 1080
      fps: 5

  camera_jardin_devant:
