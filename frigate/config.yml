# ============================================================================
#                           FRIGATE NVR – FULL CONFIGURATION
# ============================================================================
#  Author:  <your-name>
#  Date:    2025-07-14
#  Purpose: Refactored, fully-annotated, self-contained Frigate configuration
#           * NO YAML anchors – everything is explicit and copy/paste ready
#           * Heavy inline comments explain WHY each value exists, not just WHAT
#           * Clear visual separators so you can jump to any section quickly
#
#  Tested against Frigate 0.15.x (Docker Compose) on an Intel NUC iGPU host
# -----------------------------------------------------------------------------
#  QUICK INDEX
#    1. GLOBAL SETTINGS
#         1.1 MQTT – Home-Assistant event broker
#         1.2 FFMPEG – hardware decoding + record profile
#         1.3 RECORD – retention strategy
#         1.4 SNAPSHOTS – still-image settings
#         1.5 OBJECTS – what to detect and when
#         1.6 DETECTORS – CPU / Coral / GPU
#    2. CAMERAS
#         ├─ allee_sur_le_cote (Ring Floodlight Cam)
#         ├─ jardin_arriere      (Ring Spotlight Cam)
#         ├─ jardin_devant       (Ring Floodlight Cam)
#         ├─ piscine_vue_toit    (Ring Floodlight Cam)
#         ├─ vue_sur_entree_dev  (Ring Spotlight Cam)
#         └─ sonnette_video_wired (Ring Doorbell Pro 2)
#    3. ADVANCED FEATURES
#         3.1 SEMANTIC SEARCH – experiment (beta)
# ----------------------------------------------------------------------------

# ============================================================================
# 1. GLOBAL SETTINGS – APPLY TO EVERY CAMERA UNLESS OVERRIDDEN
# ============================================================================

# ---------------------------------------------------------------------------
# 1.1 MQTT – CONNECTION DETAILS TO YOUR HOME‑ASSISTANT BROKER
# ---------------------------------------------------------------------------
mqtt:
  host: 192.168.1.24         # IP/hostname of the MQTT broker (Mosquitto on HA)
  user: mosquito             # Frigate‑only MQTT username
  password: mosquito         # …and its matching password
  topic_prefix: frigate      # Change if you plan multiple Frigate instances

# ---------------------------------------------------------------------------
# 1.2 FFMPEG – HARDWARE ACCELERATION & OUTPUT PROFILES
# ---------------------------------------------------------------------------
ffmpeg:
  # The Intel NUC’s iGPU is capable of decoding H.264 streams via VA‑API.
  # This offloads work from CPU so detections stay real‑time.
  hwaccel_args: preset-vaapi

  output_args:
    # The built‑in record preset below:
    #   • copies the original video (no re‑encode) – fast & lossless
    #   • transcodes audio ➜ AAC – to satisfy browsers that reject G.711/PCMU
    record: preset-record-generic-audio-aac

# ---------------------------------------------------------------------------
# 1.3 RECORD – HOW LONG TO KEEP VIDEO CLIPS
# ---------------------------------------------------------------------------
record:
  enabled: true              # Master switch (false ➜ no recordings at all)
  retain:
    days: 3                  # Purge any clip older than X days
    mode: motion             # "all" = continuous 24/7; "motion" = only events

# ---------------------------------------------------------------------------
# 1.4 SNAPSHOTS – STILL IMAGES FOR NOTIFICATIONS / ARCHIVE
# ---------------------------------------------------------------------------
snapshots:
  enabled: true              # Global toggle; camera blocks can override
  timestamp: true            # Burn date & time onto the PNG/JPEG
  bounding_box: true         # Draw red box around detected object(s)
  clean_copy: false          # If true, overwrite with a blank (no annotation)
  crop: false                # True ➜ only keep the boxed area – saves space
  retain:
    default: 0               # Keep *non‑person* snaps for 0 days (discard)
    objects:
      person: 7              # Retain person snaps for one week

# ---------------------------------------------------------------------------
# 1.5 OBJECTS – DEFAULT DETECTION PARAMETERS (CAN BE OVERRIDDEN PER CAMERA)
# ---------------------------------------------------------------------------
objects:
  track:
    - person                 # Detect only human beings by default
  filters:
    person:
      min_area: 3000         # Ignore tiny objects (e.g. insects, leaves)     
      min_score: 0.72        # Ignore detections below this confidence
      threshold: 0.72        # Sustained confidence required to trigger event
      max_area: 200000       # Discard blobs bigger than this pixel area (e.g. stalled images due top network issues)

# ---------------------------------------------------------------------------
# 1.6 DETECTORS – CHOOSE THE HARDWARE INFERENCE ACCELERATOR
# ---------------------------------------------------------------------------
#  Options:
#    • type: cpu       – universal, slowest
#    • type: edgetpu   – Google Coral USB / PCIe (fast, low power)
#    • type: openvino  – Intel GPU/OpenVINO (experimental)
#    • type: tensorrt  – NVIDIA GPU (fast, power hungry)
# ---------------------------------------------------------------------------
detectors:
  cpu1:
    type: cpu              # Using CPU only – upgrade to Coral for speed

# ---------------------------------------------------------------------------
# 1.7 MOTION PRE‑FILTER (BEFORE ML) – default pre‑filter for all cameras
# These parameters let Frigate reject obvious noise (trees, rain) before
# sending frames to the object detector, saving CPU and false positives.
# ---------------------------------------------------------------------------
motion:
  threshold: 11           # Higher → less sensitive. # Higher ➜ require bigger pixel change
  contour_area: 10        # Ignore blobs < 10 px²
  improve_contrast: true  # Helps night scenes, more sensitive by day.  Histogram equalisation for low‑light frames

# --- Frigate audio section tuned for security-only events -------------------
audio:
  enabled: true            # Turn on audio analysis for all cameras
  # The louder the ambient noise, the higher you set min_volume
  #   ≈200  very sensitive (quiet room)
  #   ≈350  typical living-room background
  #   ≈700+ noisy street-facing cam
  min_volume: 350

  # Frigate will ONLY publish events whose label is in this list ----------------
  listen:
    # ── Group 1: forced-entry / violence ───────────────────────────────────────
    - glass_breaking        # Window/door smash
    - gunshot_gunfire       # Handgun or rifle report
    - explosion             # Large bang (can include fireworks)
    - scream                # Human distress
    - yell                  # Aggressive shouting

    # ── Group 2: life-safety alarms ────────────────────────────────────────────
    - smoke_alarm           # Residential smoke detector pattern
    - fire_alarm            # Commercial horn-strobe tone
    - carbon_monoxide_alarm # CO detector beeps
    - car_alarm             # Vehicle alarm siren
    - siren                 # Police / ambulance siren nearby


# ============================================================================
# 2. CAMERA DEFINITIONS – ONE BLOCK PER PHYSICAL CAMERA
# ============================================================================

cameras:

  # ========================================================================
  # 2.1 CAMERA: ALLEE_SUR_LE_COTE – DRIVEWAY SIDE VIEW
  #           * Ring Floodlight Cam
  #           * Has microphone + speaker
  #           * Primary outdoor security feed
  # ========================================================================
  allee_sur_le_cote:
    # --- AUDIO -------------------------------------------------------------
    audio:
      enabled: false            # Keep mic track – useful for analytics later

    # --- STREAM INPUTS -----------------------------------------------------
    #   • The *DETECT* stream is a secondary/sub‑stream configured on the camera at a
    #     lower resolution and bitrate.  Using a lighter stream keeps the Frigate ML
    #     inference pipeline light on CPU/GPU while still giving enough detail to
    #     recognise a person.
    #   • The *RECORD* stream is the camera's full‑fat primary stream.  It is copied
    #     bit‑for‑bit into the clip archive so you can zoom in and read licence plates
    #     after the fact.
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/reolink_duo_allee_cote_sub
          roles: [detect]
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/reolink_duo_allee_cote_main
          roles: [record, audio]
    # --- PER‑CAMERA MQTT SNAPSHOTS VS REGULAR SNAPSHOTS --------------------
    #  Frigate supports *two* ways to generate still images:
    #    1. **Standard snapshots** – produced automatically for every detection
    #       event and stored on disk according to the global `snapshots:` policy.
    #    2. **MQTT on‑demand snapshots** – created *only* when another service
    #       (e.g. Home‑Assistant) publishes a message like:
    #         `frigate/alle_sur_le_cote/snapshot/set` ➜ "ON"
    #       Frigate then publishes the image payload back on the topic
    #         `frigate/alle_sur_le_cote/snapshot`
    #       This is handy if you want a *live* photo in notifications without
    #       saving it permanently.
    #  The `mqtt:` section below only affects the *on‑demand* path.  Regular
    #  snapshots still follow the global and per‑camera `snapshots:` settings.
    mqtt:
      enabled: true             # Allow MQTT snapshot overrides here
      timestamp: true           # Burn timestamp on MQTT images
      bounding_box: true        # Draw annotated boxes on MQTT images
      crop: false               # Keep whole frame for MQTT snapshots

    # --- DETECTION SETTINGS ----------------------------------------------
    detect:
      width: 1536
      height: 432
      fps: 2                    # Higher FPS ➜ smoother but more CPU

    # --- OBJECT FILTER OVERRIDE (APPLIES ONLY TO THIS CAMERA) ------------
    #objects:
    #  track:
    #    - person                # Detect people only on this cam
    #  filters:
    #    person:
    #      min_score: 0.51       # Lower than global to be more sensitive
    #      threshold: 0.70       # Require sustained 0.70

    # --- SNAPSHOTS --------------------------------------------------------
    snapshots:
      enabled: true             # Inherit global settings

    # --- ZONES (VIRTUAL TRIPWIRES) ---------------------------------------
    zones:
      # Zone: "prive" – Private driveway; alert immediately
      prive:
        coordinates: 
          0.276,1,0,1,0,0.539,0.064,0.645,0.104,0.361,0.102,0.329,0.092,0.31,0.131,0.248,0.225,0.112,0.323,0,0.478,0,0.65,0,0.693,0.053,0.762,0.129,0.827,0.22,0.887,0.323,0.908,0.362,0.925,0.332,0.95,0.331,0.963,0.395,0.972,0.439,0.989,0.588,1,0.573,0.999,0.996
        loitering_time: 0        # Trigger instantly – anyone in driveway
        inertia: 3              # Keep event "open" 3 s after object leaves
        objects: person         # Only consider people

      # Zone: "rodage" – Loitering detection near fence line
      rodage:
        coordinates: 0.075,0.473,0.094,0.335,0.101,0.343,0.064,0.623,0.056,0.612
        loitering_time: 10      # Person must stay 10 s before event
        inertia: 3
        objects: person

    # --- REVIEW RULES – TIE ZONES TO ALERT TYPES -------------------------
    review:
      alerts:
        required_zones: prive    # Only alert if object passed through "prive"
      detections:
        required_zones: rodage   # Record detection events if in "rodage"

  # ========================================================================
  # 2.2 CAMERA: JARDIN_ARRIERE – BACK GARDEN
  #           * Ring Spotlight Cam (battery, no microphone feed)
  #           * Covers children’s play area and garden shed
  # ========================================================================
  jardin_arriere:
    # --- AUDIO -------------------------------------------------------------
    audio:
      enabled: true            # Keep mic track – useful for analytics later 

    # --- STREAM INPUTS -----------------------------------------------------
    #   Uses the same dual‑stream pattern as the driveway cam:
    #     • Lower‑res sub‑stream ➜ detection
    #     • Full‑res main stream ➜ archival recording
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/jardin_arriere_detect   # [DETECT stream]
          roles: [detect, record, audio]

    # --- DETECTION SETTINGS ----------------------------------------------
    detect:
      width: 1920               # Full‑HD needed for persons who are further out
      height: 1080
      fps: 2                    # Any higher ➜ battery hit + more CPU

    # --- SNAPSHOTS --------------------------------------------------------
    snapshots:
      enabled: true             # Stick with global snapshot policy

    # --- MOTION PRE‑FILTER (BEFORE ML) ------------------------------------
    #  These parameters let Frigate reject obvious noise (trees, rain) before
    #  sending frames to the object detector, saving CPU and false positives.
    motion:
      threshold: 11             # Higher ➜ require bigger pixel change
      contour_area: 10          # Ignore extremely small blobs <10 px²
      improve_contrast: true    # Histogram equalisation for low‑light frames

    # --- ZONES -----------------------------------------------------------
    zones: {}                   # Full frame monitoring – no zone gating

    # --- REVIEW RULES ----------------------------------------------------
    review: {}                  # Every detection event is archived; no alerts

  # ========================================================================
  # 2.3 CAMERA: JARDIN_DEVANT – FRONT GARDEN / ROAD
  #           * Ring Floodlight Cam
  #           * Faces a public road – needs stricter privacy filters
