      height: 1080
      fps: 5

    # --- OBJECT FILTERS --------------------------------------------------
    #objects:
    #  track:
    #    - person                # Only track people (ignore cars for privacy)
    #  filters:
    #    person:
    #      min_area: 3000        # Disregard tiny silhouettes in the road area
    #      min_score: 0.70       # Confidence threshold
    #      threshold: 0.70

    # --- SNAPSHOTS --------------------------------------------------------
    snapshots:
      enabled: true             # Standard snapshot behaviour

    # --- ZONES (PRIVACY & LOITERING) -------------------------------------
    zones:
      # "rodage" – Extended perimeter near public sidewalk
      rodage:
        coordinates: 
          0.225,0.284,0.232,0.246,0.481,0.246,0.61,0.256,0.686,0.278,0.689,0.304,0.698,0.305,0.833,0.328,0.841,0.351,0.827,0.373,0.806,0.383,0.696,0.369,0.699,0.352,0.679,0.309,0.644,0.425,0.5,0.418,0.264,0.407
        loitering_time: 10      # Person must loiter ≥ 10 s before event
        inertia: 3              # Keep event open for 3 s after leaving zone
        objects: person
        # Legacy Ring people filter (kept for backwards compat)
        filters:
          person:
            threshold: 150

      # "prive" – Area inside fence close to house
      prive:
        coordinates: 
          0.015,0.728,0.136,0.808,0.161,0.629,0.193,0.501,0.211,0.396,0.249,0.355,0.282,0.429,0.262,0.415,0.306,0.418,0.412,0.421,0.644,0.436,0.675,0.341,0.687,0.341,0.682,0.358,0.676,0.403,0.807,0.433,0.829,0.445,0.83,0.42,0.872,0.554,0.913,0.817,1,0.785,1,1,0,1
        loitering_time: 0       # Immediate intrusion alert
        inertia: 3
        objects: person

    # --- REVIEW RULES ----------------------------------------------------
    review:
      alerts:
        required_zones: prive    # Only push notifications inside private zone
      detections:
        required_zones: rodage   # Record events if loitering near sidewalk

  # ========================================================================
