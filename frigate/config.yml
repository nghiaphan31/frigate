# ========================================================================
# CAMERA: JARDIN_DEVANT2 — Front garden / road (Reolink Duo 3)
# - Substream used for detection (ultra-wide 1536x432)
# - Main stream used for recording + audio
# - Faces a public road → stricter zoning, loitering band, and privacy rules
# ========================================================================
  jardin_devant2:
    # ---------------------------- STREAM INPUTS -----------------------------
    ffmpeg:
      # Tip: if VA-API crashes on detect for Duo 3, uncomment to force software decode ONLY for this cam:
      # hwaccel_args: []
      inputs:
        # Low-res substream → detection (lighter, faster)
        - path: rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_sub
          roles: [detect]
        # High-res main stream → recording (and audio if present)
        - path: rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_main
          roles: [record, audio]

    # --------------------------- AUDIO (RECORD) -----------------------------
    audio:
      enabled: true            # Keep mic channel in recordings (useful for later analytics/rules)

    # --------------------------- DETECTION CORE -----------------------------
    detect:
      width: 1536              # Match substream width (ultra-wide)
      height: 432              # Match substream height
      fps: 4                   # Balanced: enough chances to catch a good pose, still light on CPU

    # ---------------------------- MOTION GATING -----------------------------
    motion:
      # Trim night foliage/IR sparkle so the detector isn’t spammed with useless frames.
      threshold: 34            # Slightly stricter than default 30
      contour_area: 120        # Ignore very small moving blobs
      frame_alpha: 0.25        # Background blend factor
      delta_alpha: 0.25        # Motion blend factor

    # ------------------------------ OBJECTS --------------------------------
    objects:
      track:
        - person               # Only track people (ignore vehicles for privacy)
      filters:
        person:
          # Global person filter (applies everywhere unless a zone overrides it)
          min_area: 2500       # Drop tiny, far silhouettes (street)
          max_area: 200000     # Safety cap for broken frames/huge blobs
          min_ratio: 0.20      # Allow tall/narrow boxes (bust-only, seen from above)
          max_ratio: 3.5       # Disallow ultra-thin poles / extreme aspect boxes
          threshold: 0.65      # Base confidence; zones can override lower

          # Optional: keep tracks alive when briefly occluded (bush/wall edge)
          # max_disappeared: 30

    # ------------------------------ SNAPSHOTS -------------------------------
    snapshots:
      enabled: true            # Standard snapshot behaviour (uses main stream quality if configured globally)

    # --------------------------- ZONES & BEHAVIOUR --------------------------
    zones:

