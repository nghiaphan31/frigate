# -------------------------------------------------------------------------
# Frigate config.yml (annotated)
# -------------------------------------------------------------------------
# Frigate = NVR & real‑time object detection
# This file is fully self‑contained and ready to drop into ./frigate/config.yml
# -------------------------------------------------------------------------
#  • MQTT section          – connection to Home‑Assistant broker for events
#  • FFmpeg hw‑accel       – tells Frigate to use Intel VA‑API decode on the NUC
#  • Record block          – controls clip retention (adjust to match disk size)
#  • Detectors             – CPU only for now (add Coral or GPU if available)
#  • Cameras               – each Ring stream appears twice:
#                               * *_detect  :  low‑bitrate, low‑resolution feed
#                               * *_record  :  full‑resolution feed for archiving
# -------------------------------------------------------------------------

mqtt:
  host: 192.168.1.24                # same broker ring‑mqtt uses
  user: mosquito
  password: mosquito
  topic_prefix: frigate             # rename if you want multiple Frigate instances

ffmpeg:
  # Use the NUC's iGPU for H.264 decode; keep preset‑vaapi unless you add NVIDIA
  hwaccel_args: preset-vaapi
  output_args:
    # Copy video as-is and transcode the audio to AAC so every browser can play it
    record: preset-record-generic-audio-aac
record:
  enabled: true
  retain:
    days: 3                         # How long to keep motion clips
    mode: motion                    # 'all' records 24/7; uses much more disk

detectors:
  cpu1:
    type: cpu                       # Change to 'edgetpu' if you add a Coral USB

cameras:

  allee_sur_le_cote:
    audio:
      enabled: true          # just permits the track
    # listen: []            # leave empty unless you want siren/bark/speech detection
    ffmpeg:
      inputs:
        # Detect stream – 1280×720 @ 5 fps keeps CPU low
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/allee_sur_le_cote_detect
          roles: [detect]
        # Record stream – full HD at Ring's native bitrate
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/allee_sur_le_cote_record
          roles: [record]
    detect:
      width: 1280
      height: 720
      fps: 5
    zones:
      prive:
        coordinates: 
          0.001,0.996,0,0.577,0.053,0.41,0.045,0.395,0.054,0.371,0.045,0.35,0.05,0.335,0.128,0.293,0.226,0.259,0.353,0.237,0.468,0.229,0.6,0.228,0.689,0.232,0.814,0.254,0.885,0.275,0.975,0.319,0.999,0.331,0.999,0.996
        loitering_time: 0
    review:
