    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/jardin_devant_detect  # [DETECT stream]
          roles: [detect, record, audio]

#      output_args:              # Override global – re‑encode to burn timestamp
#        record: preset-vaapi

    # --- DETECTION SETTINGS ----------------------------------------------
    detect:
