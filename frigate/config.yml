mqtt:
  host: 192.168.1.24
  user: mosquito
  password: mosquito
  topic_prefix: frigate           # keep default or rename; HA will auto-discover

ffmpeg:
  hwaccel_args: preset-vaapi      # use the NUC’s iGPU to decode H.264

record:
  enabled: true
  retain:
    days: 3                       # keep clips for three days
    mode: motion                  # full timeline uses a lot of space—motion is enough


detectors:                        # use CPU by default; add coral/edgetpu later if you have one
  cpu1:
    type: cpu

cameras:

  allee_sur_le_cote:
    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/allee_sur_le_cote_detect
          roles: [detect]
        - path: rtsp://go2rtc:go2rtc@192.168.1.36:8556/allee_sur_le_cote_record
          roles: [record]
    detect:
      width: 1280                 # down-scaled copy keeps inference fast
      height: 720
      fps: 5

  jardin_arriere:
