mqtt:
  host: 192.168.1.24
  port: 1883
  user: mosquito
  password: mosquito
  topic_prefix: frigate


# ─────────────── SIX RING SNAPSHOT CAMERAS ───────────────
cameras:

  allee_sur_le_cote:
    ffmpeg:
      inputs:
        - path: http://192.168.1.24:8123/api/camera_proxy/camera.camera_allee_sur_le_cote_snapshot
          roles: [detect]
          input_args:
            - "-re"
            - "-headers"
            - "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiI0NGYyYmI3M2UzNjE0ZTc5OTZiODU2ZDdlY2EzZWE5NyIsImlhdCI6MTc0OTIzNDg1OSwiZXhwIjoyMDY0NTk0ODU5fQ.SvQ8VNy0vLXjllKLgGOcH1mNffO-EIuXz_iVRHCii2g\r\n"   # <── keep the \r\n
            - "-r"
            - "1"
            - "-f"
            - "image2pipe"
    detect:
      width: 1280
      height: 720
      fps: 1
    objects:
      track: [person]
    record:
      enabled: false
    snapshots:
      enabled: false

  jardin_devant:
