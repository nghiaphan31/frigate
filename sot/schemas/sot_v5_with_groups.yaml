---
# =============================================================================
# SoT v5 Schema — Devices + Groups
# -----------------------------------------------------------------------------
# Extends v4 to include groups with human-semantic naming, categories, and FQDNs.
# =============================================================================
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "SoT v5 Schema"
type: object
required: ["meta", "devices", "groups"]
properties:
  meta:
    type: object
    required: ["schema_version", "zone_root"]
    properties:
      schema_version: {type: number}
      zone_root: {type: string}
      naming_policy: {type: string}
      last_updated: {type: string}
  devices:
    type: array
    items:
      type: object
      required: ["sot_id", "alias_human", "hostname", "category"]
      properties:
        sot_id: {type: string}
        alias_human: {type: string}
        hostname: {type: string}
        category: {type: string}
        fqdn: {type: string}
        location: {type: object}
        interfaces: {type: array}
        manufacturer: {type: string}
        model: {type: string}
        owner: {type: string}
        status: {type: string}
  groups:
    type: array
    items:
      type: object
      required: ["group_id", "alias_human", "hostname", "category"]
      properties:
        group_id: {type: string}
        alias_human: {type: string}
        hostname: {type: string}
        category: {type: string}
        fqdn: {type: string}
        members: {type: array}
        includes: {type: array}
        nlu: {type: object}
        integrations: {type: object}
        owner: {type: string}
        status: {type: string}
