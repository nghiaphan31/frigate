mqtt:
  host: 192.168.50.125
  user: mosquito
  password: mosquito
  topic_prefix: calypso_frigate
  client_id: frigate_calypso_client

ffmpeg:
  path: /usr/lib/ffmpeg/7.0
  hwaccel_args:
    - -hwaccel
    - cuda
    - -hwaccel_device
    - '0'
  output_args:
    record: preset-record-generic-audio-aac

record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 1

snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  clean_copy: true
  crop: false
  retain:
    default: 0
    objects:
      person: 7

objects:
  track:
    - person
  filters:
    person:
      min_area: 300
      min_score: 0.40
      threshold: 0.45
      max_area: 100000

detect:
  enabled: true

detectors:
  onnx1:
    type: onnx
    device: "Tensorrt"

model:
  path: plus://6ea1f38db36e21f44a1eb1071d9958ed

motion:
  threshold: 26
  contour_area: 30
  frame_alpha: 0.4
  delta_alpha: 0.5
  improve_contrast: true

audio:
  enabled: true
  min_volume: 350

go2rtc:
  webrtc:
    candidates:
      - 192.168.50.150:8555
      - stun:8555
  streams:
    allee_sur_le_cote_sub:
      - rtsp://admin:fG-56lui@192.168.50.129:8554/h264Preview_01_sub

cameras:

