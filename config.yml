# ============================================================================
#                           FRIGATE NVR – FULL CONFIGURATION
# ============================================================================
#  Author:  <your-name>
#  Date:    2025-07-14
#  Purpose: Refactored, fully-annotated, self-contained Frigate configuration
#           * NO YAML anchors – everything is explicit and copy/paste ready
#           * Heavy inline comments explain WHY each value exists, not just WHAT
#           * Clear visual separators so you can jump to any section quickly
#
  # Calypso - RTX 5060 Ti 16G GPU
# -----------------------------------------------------------------------------
#  QUICK INDEX
#    1. GLOBAL SETTINGS
#         1.1 MQTT – Home-Assistant event broker
#         1.2 FFMPEG – hardware decoding + record profile
#         1.3 RECORD – retention strategy
#         1.4 SNAPSHOTS – still-image settings
#         1.5 OBJECTS – what to detect and when
#         1.6 DETECTORS – CPU / Coral / GPU
#    2. CAMERAS
#         ├─ allee_sur_le_cote (Ring Floodlight Cam)
#         ├─ jardin_arriere      (Ring Spotlight Cam)
#         ├─ jardin_devant       (Ring Floodlight Cam)
#         ├─ piscine_vue_toit    (Ring Floodlight Cam)
#         ├─ vue_sur_entree_dev  (Ring Spotlight Cam)
#         └─ sonnette_video_wired (Ring Doorbell Pro 2)
#    3. ADVANCED FEATURES
#         3.1 SEMANTIC SEARCH – experiment (beta)
# ----------------------------------------------------------------------------

# ============================================================================
# 1. GLOBAL SETTINGS – APPLY TO EVERY CAMERA UNLESS OVERRIDDEN
# ============================================================================

# ---------------------------------------------------------------------------
# 1.1 MQTT – CONNECTION DETAILS TO YOUR HOME‑ASSISTANT BROKER
# ---------------------------------------------------------------------------
mqtt:
  host: 192.168.50.125         # IP/hostname of the MQTT broker (Mosquitto on HA)
  user: mosquito             # Frigate‑only MQTT username
  password: mosquito         # …and its matching password
  topic_prefix: calypso_frigate      # Change if you plan multiple Frigate instances

# ---------------------------------------------------------------------------
# 1.2 FFMPEG – HARDWARE ACCELERATION & OUTPUT PROFILES
# ---------------------------------------------------------------------------
ffmpeg:
  # Calypso RTX 5060 Ti 16G - TEMPORARILY DISABLED
  # Using CPU detector, so disabling CUDA hwaccel to avoid FFmpeg errors.
  # Re-enable once tensorRT image is available or CUDA is properly configured.
  # hwaccel_args: preset-nvidia
  hwaccel_args: []   # Empty = software decoding only

  output_args:
    # The built‑in record preset below:
    #   • copies the original video (no re‑encode) – fast & lossless
    #   • transcodes audio ➜ AAC – to satisfy browsers that reject G.711/PCMU
    record: preset-record-generic-audio-aac

# ---------------------------------------------------------------------------
# 1.3 RECORD – HOW LONG TO KEEP VIDEO CLIPS
# ---------------------------------------------------------------------------
record:
  enabled: true              # Master switch (false ➜ no recordings at all)
  continuous:
    days: 0
  motion:
    days: 3
snapshots:
  enabled: true              # Global toggle; camera blocks can override
  timestamp: true            # Burn date & time onto the PNG/JPEG
  bounding_box: true         # Draw red box around detected object(s)
  clean_copy: true          # If true, overwrite with a blank (no annotation)
  crop: false                # True ➜ only keep the boxed area – saves space
  retain:
    default: 0               # Keep *non‑person* snaps for 0 days (discard)
    objects:
      person: 7              # Retain person snaps for one week

# ---------------------------------------------------------------------------
# 1.5 OBJECTS – DEFAULT DETECTION PARAMETERS (CAN BE OVERRIDDEN PER CAMERA)
# ---------------------------------------------------------------------------
objects:
  track:
    - person                 # Detect only human beings by default
  filters:
    person:
      min_area: 300          # Ignore tiny objects (e.g. insects, leaves)     
      min_score: 0.72        # Ignore detections below this confidence
      threshold: 0.72        # Sustained confidence required to trigger event
      max_area: 100000       # Discard blobs bigger than this pixel area (e.g. stalled images due top network issues)

# ---------------------------------------------------------------------------
# 1.6 DETECTORS – Calypso RTX 5060 Ti 16G (NVIDIA GPU with TensorRT)
# ---------------------------------------------------------------------------
#  Options:
#    • type: cpu       – universal, slowest
#    • type: edgetpu   – Google Coral USB / PCIe (fast, low power)
#    • type: openvino  – Intel GPU/OpenVINO (experimental)
#    • type: tensorrt  – NVIDIA GPU (fast, power hungry)
# ---------------------------------------------------------------------------
detectors:
  cpu1:
    type: cpu         # Using CPU detector (temporary until tensorRT image is available)

# ---------------------------------------------------------------------------
# 1.7 FRIGATE+ CUSTOM MODEL – trained model for improved detection
# ---------------------------------------------------------------------------
model:
  path: plus://b928831497c87e933467243e88ffc218

# ---------------------------------------------------------------------------
# 1.8 MOTION PRE-FILTER (BEFORE ML) – default pre-filter for all cameras
# ---------------------------------------------------------------------------
motion:
  # Plus haut ➜ moins sensible. 26 reste assez sensible pour l’allumage de lumière,
  # mais filtre déjà pas mal de micro-mouvements.
  threshold: 26

  # Rejette les tout petits blobs (feuilles isolées, bruit).
  contour_area: 30

  # Lissage temporel : évite de “sauter” sur un changement ultra ponctuel
  frame_alpha: 0.4
  delta_alpha: 0.5

  # Garde ça, ça aide beaucoup de nuit sans trop pénaliser le jour
  improve_contrast: true

# --- Frigate audio section tuned for security-only events -------------------
audio:
  enabled: true            # Turn on audio analysis for all cameras
  # Start slightly conservative; raise if you get too many false events
  # The louder the ambient noise, the higher you set min_volume
  #   ≈200  very sensitive (quiet room)
  #   ≈350  typical living-room background
  #   ≈700+ noisy street-facing cam
  min_volume: 350

  # Omit 'listen:' at first so you see everything Frigate recognizes.
  # After you confirm events appear, reintroduce 'listen:' with just the labels you want.  

#  # Frigate will ONLY publish events whose label is in this list ----------------
#  listen:
#    # ── Group 1: forced-entry / violence ───────────────────────────────────────
#    - glass_breaking        # Window/door smash
#    - gunshot_gunfire       # Handgun or rifle report
#    - explosion             # Large bang (can include fireworks)
#    - scream                # Human distress
#    - yell                  # Aggressive shouting
#
#    # ── Group 2: life-safety alarms ────────────────────────────────────────────
#    - smoke_alarm           # Residential smoke detector pattern
#    - fire_alarm            # Commercial horn-strobe tone
#    - carbon_monoxide_alarm # CO detector beeps
#    - car_alarm             # Vehicle alarm siren
#    - siren                 # Police / ambulance siren nearby


# ============================================================================
# 2. CAMERA DEFINITIONS – ONE BLOCK PER PHYSICAL CAMERA
# ============================================================================

cameras:

  # ========================================================================
  # CAMERA: ALLEE_SUR_LE_COTE — Driveway side view (Reolink Duo 3 Wi-Fi ETH)
  # - Substream → detection (ultra-wide 1536x432, light for ML)
  # - Main stream → recording + audio
  # - Primary outdoor security feed (with mic + speaker)
  # ========================================================================
  allee_sur_le_cote:

    # ---------------------------- STREAM INPUTS -----------------------------
    ffmpeg:
      # hwaccel_args: []   # Uncomment if VA-API crashes on detect
      inputs:
        - path: 
            rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_sub
          roles: [detect]
        - path: 
            rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main
          roles: [record, audio]

    # --------------------------- AUDIO (RECORD) -----------------------------
    audio:
      enabled: true              # Keep mic channel in recordings

    # --------------------------- MQTT SNAPSHOTS -----------------------------
    # Allows Home Assistant (or others) to request on-demand snapshots via MQTT.
    mqtt:
      enabled: true              # Enable MQTT snapshots
      timestamp: true            # Add timestamp overlay
      bounding_box: true         # Draw bounding boxes
      crop: false                # Send whole frame (not cropped to object)

    # --------------------------- DETECTION CORE -----------------------------
    detect:
      width: 1536
      height: 432
      fps: 5                     # Balanced; raise if NUC load is fine

    # ------------------------------ OBJECTS --------------------------------
    objects:
      track: [person]            # Focus only on people
      filters:
        person:
          min_area: 4000         # Ignore tiny blobs (far away, street)
          max_area: 12000       # Prevent runaway boxes from broken frames
          min_ratio: 0.20        # Allow tall, narrow shapes
          max_ratio: 3.5         # Disallow extreme vertical poles etc.
          threshold: 0.65        # Base detection threshold

    # ------------------------------ SNAPSHOTS -------------------------------
    snapshots:
      enabled: true              # Standard snapshot behaviour

    # --------------------------- ZONES & BEHAVIOUR --------------------------
    zones:
      # ---- 'prive' — Private driveway (immediate alerts) ------------------
      prive:
        coordinates: 
          0.276,1,0,1,0,0.539,0.064,0.645,0.104,0.361,0.102,0.329,0.092,0.31,0.131,0.248,0.225,0.112,0.323,0,0.478,0,0.65,0,0.693,0.053,0.762,0.129,0.827,0.22,0.887,0.323,0.908,0.362,0.925,0.332,0.95,0.331,0.963,0.395,0.972,0.439,0.989,0.588,1,0.573,0.999,0.996
        loitering_time: 0        # Trigger immediately when person enters
        inertia: 3               # Hold event for 3s after leaving
        objects: [person]
        filters:
          person:
            threshold: 0.55      # Allow lower-confidence partial views
            min_area: 4000       # Allow smaller (bust-only) boxes
            min_ratio: 0.15      # Allow tall, narrow boxes
            max_ratio: 4.0       # Allow more square boxes

      # ---- 'rodage' — Fence line / loitering detection --------------------
      rodage:
        coordinates: 0.075,0.473,0.094,0.335,0.101,0.343,0.064,0.623,0.056,0.612
        loitering_time: 10       # Require ≥10s loitering before event
        inertia: 3
        objects: [person]
        filters:
          person:
            threshold: 0.62
            min_area: 4000
            min_ratio: 0.20
            max_ratio: 3.8

    # ----------------------------- REVIEW RULES -----------------------------
    review:
      alerts:
        required_zones: prive    # Only alert if event entered private zone
      detections:
        required_zones: rodage   # Keep events when someone lingers at rodage

