# ============================================================================
#                           FRIGATE NVR – FULL CONFIGURATION
# ============================================================================
#  Host:    Calypso (RTX 5060 Ti 16 GB GPU)
#  Date:    2026-05-30
#  Branch:  detection-optimisation
#
#  Purpose: Refactored, fully-annotated, self-contained Frigate configuration
#           * NO YAML anchors – everything is explicit and copy/paste ready
#           * Heavy inline comments explain WHY each value exists, not just WHAT
#           * Clear visual separators so you can jump to any section quickly
#
# -----------------------------------------------------------------------------
#  QUICK INDEX
#    1. GLOBAL SETTINGS
#         1.1  MQTT         – Home-Assistant event broker
#         1.2  FFMPEG       – CUDA hardware decoding + record profile
#         1.3  RECORD       – retention strategy
#         1.4  SNAPSHOTS    – still-image settings
#         1.5  OBJECTS      – default detection parameters
#         1.6  DETECTORS    – NVIDIA GPU via ONNX Runtime + TensorRT
#         1.7  MODEL        – Frigate+ custom trained model
#         1.8  MOTION       – global pre-filter (before ML)
#         1.9  AUDIO        – security-event audio analysis
#         1.10 GO2RTC       – proxy via NUC go2rtc (192.168.50.112:8556); crops done by Frigate ffmpeg
#    2. CAMERAS
#         ├─ allee_sur_le_cote        Reolink Duo 3  – 192.168.50.129
#         │    ├─ allee_sur_le_cote_left   (left half)
#         │    └─ allee_sur_le_cote_right  (right half)
#         ├─ jardin_arriere           Reolink RLC-810A (single-lens) – 192.168.50.207
#         ├─ vue_entree               Reolink Doorbell POE – 192.168.50.222
#         ├─ jardin_devant            Reolink Duo 3  – 192.168.50.18
#         │    ├─ jardin_devant_left       (left half)
#         │    └─ jardin_devant_right      (right half)
#         └─ piscine_vue_toit         Reolink Duo 3  – 192.168.50.7
#              ├─ piscine_vue_toit_left    (left half)
#              └─ piscine_vue_toit_right   (right half)
#    3. ADVANCED FEATURES
#         3.1 SEMANTIC SEARCH
# ----------------------------------------------------------------------------
#
#  STREAM RESOLUTION REFERENCE
#  ─────────────────────────────────────────────────────────────────────────
#  Camera                  │ Main stream   │ Sub stream  │ Detect crop
#  ────────────────────────┼───────────────┼─────────────┼──────────────────
#  Reolink Duo 3 (×3)      │ 4096×1152     │ 1536×432    │ 2048×1152 (L or R)
#  Reolink RLC-810A        │ 3840×2160 4K  │ 640×360     │ —
#  Reolink Doorbell POE    │ 2560×1920     │ 640×480     │ —
#  ─────────────────────────────────────────────────────────────────────────
#
#  CAMERA FOV REFERENCE
#  ─────────────────────────────────────────────────────────────────────────
#  Camera                  │ Model                        │ V-FOV │ H-FOV
#  ────────────────────────┼──────────────────────────────┼───────┼───────
#  Reolink Duo 3 (×3)      │ Reolink Duo 3                │ 55°   │ 180°
#  Reolink RLC-810A        │ Reolink RLC-810A (4.0 mm)    │ 44°   │ 87°
#  Reolink Doorbell POE    │ Reolink Doorbell POE         │ 100°  │ 135°
#  ─────────────────────────────────────────────────────────────────────────
#
#  DETECTION STREAM STRATEGY
#  ─────────────────────────────────────────────────────────────────────────
#  • Duo 3 whole-panoramic (4096×1152) is NOT used directly for detection —
#    the 3.5:1 aspect ratio is incompatible with most object detection model
#    input shapes. Instead, Frigate's own ffmpeg crops each Duo 3 main stream
#    into two 2048×1152 halves using CUDA hwdownload+crop in output_args.detect.
#  • All cameras use main-stream for detection to maximise pixel density.
#  • jardin_arriere (4K) is capped at 5 fps for detection — the model input
#    is 320×320 regardless, so 10 fps at 4K would waste GPU decode bandwidth.
#  ─────────────────────────────────────────────────────────────────────────
#
#  DETECTION PARAMETER STATUS (iter0 — physics-based parameters)
#  ─────────────────────────────────────────────────────────────────────────
#  Parameters computed from camera geometry (height, tilt, FOV, resolution)
#  to detect a 160cm person at the camera's maximum detection distance.
#  See: plans/detection-optimisation-v2-plan.md § Phase 1
#  ─────────────────────────────────────────────────────────────────────────

# ============================================================================
# 1. GLOBAL SETTINGS – APPLY TO EVERY CAMERA UNLESS OVERRIDDEN
# ============================================================================

# ---------------------------------------------------------------------------
# 1.1 MQTT – CONNECTION TO HOME-ASSISTANT MOSQUITTO BROKER
# ---------------------------------------------------------------------------
mqtt:
  host: 192.168.50.125         # Mosquitto broker on Home Assistant
  user: mosquito
  password: mosquito
  topic_prefix: calypso_frigate
  client_id: frigate_calypso_client

# ---------------------------------------------------------------------------
# 1.2 FFMPEG – CUDA HARDWARE ACCELERATION & OUTPUT PROFILES
# ---------------------------------------------------------------------------
ffmpeg:
  # RTX 5060 Ti 16 GB — CUDA hardware decoding enabled.
  # -hwaccel_output_format cuda is intentionally omitted globally: it would
  # leave decoded frames as CUDA surfaces, breaking non-crop cameras whose
  # default -vf fps/scale filter cannot operate on CUDA surfaces.
  # Crop cameras override hwaccel_args per-camera to add hwaccel_output_format
  # cuda, enabling the hwdownload,format=nv12,format=yuv420p,crop= filter chain.
  hwaccel_args:
    - -hwaccel
    - cuda
    - -hwaccel_device
    - '0'

  output_args:
    # preset-record-generic-audio-aac:
    #   • copies original video stream (no re-encode) — fast and lossless
    #   • transcodes audio to AAC — required by browsers that reject G.711/PCMU
    record: preset-record-generic-audio-aac

# ---------------------------------------------------------------------------
# 1.3 RECORD – VIDEO RETENTION POLICY
# ---------------------------------------------------------------------------
record:
  enabled: true
  continuous:
    days: 0                    # No continuous recording — motion-triggered only
  motion:
    days: 1                    # Keep motion-triggered clips for 1 day
                               # Reduced from 3 days: 11 cameras at high resolution
                               # (up to 4K) fills disk in <1h at 3-day retention.
                               # Increase back to 3 days once storage is sized correctly.

# ---------------------------------------------------------------------------
# 1.4 SNAPSHOTS – STILL-IMAGE SETTINGS
# ---------------------------------------------------------------------------
snapshots:
  enabled: true
  timestamp: true              # Burn date & time onto the image
  bounding_box: true           # Draw bounding box around detected object
  clean_copy: true             # Also save an unannotated copy
  crop: false                  # Keep full frame (not cropped to bounding box)
  retain:
    default: 0                 # Discard non-person snapshots immediately
    objects:
      person: 7                # Keep person snapshots for 7 days

# ---------------------------------------------------------------------------
# 1.5 OBJECTS – DEFAULT DETECTION PARAMETERS (overridden per camera below)
# ---------------------------------------------------------------------------
objects:
  track:
    - person
  filters:
    person:
      # Global defaults — cameras that don't override these inherit them.
      # Sub-stream panoramic cameras (allee_sur_le_cote, jardin_devant,
      # piscine_vue_toit) now override threshold/min_score/min_area directly.
      # These global values are the fallback for any camera without overrides.
      min_area: 300            # Covers person at 17m on 432px sub-stream (≈516px²)
      min_score: 0.40          # Lowered globally to catch small/distant persons
      threshold: 0.45          # Lowered globally to catch small/distant persons
      max_area: 100000         # Discard oversized blobs (e.g. frozen/corrupt frames)

# ---------------------------------------------------------------------------
# 1.6 DETECT – GLOBAL ENABLE (required; Frigate 0.17.1 defaults to false)
# ---------------------------------------------------------------------------
detect:
  enabled: true                # Must be explicitly true — Frigate default is false

# ---------------------------------------------------------------------------
# 1.7 DETECTORS – RTX 5060 Ti 16 GB via ONNX Runtime + TensorRT
# ---------------------------------------------------------------------------
detectors:
  onnx1:
    type: onnx                 # NVIDIA GPU inference via ONNX Runtime
    # device: "0" (CUDAExecutionProvider) deadlocks on RTX 5060 Ti (Blackwell/GB206)
    # with ONNX Runtime 1.22.0 — CudaGraphRunner hangs on first run_with_iobinding.
    # device: "Tensorrt" uses TensorrtExecutionProvider (bypasses CudaGraphRunner entirely).
    #   Requires TRT 10.7+ for SM 120 (Blackwell GB206) support.
    #   TRT 10.9.0 installed in container via pip (tensorrt-cu12-libs==10.9.0.34).
    #   ldconfig entry: /etc/ld.so.conf.d/tensorrt.conf → tensorrt_libs dir.
    #   First run builds TRT engine cache (~5 min); subsequent runs load from cache at ~2-5ms.
    #   Cache persisted in ./trt-cache:/config/model_cache/tensorrt/ort/trt-engines/.
    # Fallback: device: "CPU" — plain CPUExecutionProvider, ~122ms inference, no GPU deadlock.
    device: "Tensorrt"         # TRT 10.9.0 + SM 120 support — ~2-5ms inference

# ---------------------------------------------------------------------------
# 1.7 MODEL – Frigate+ custom trained model
# ---------------------------------------------------------------------------
# This plus:// model was trained on snapshots from these cameras.
# It improves detection accuracy for the specific angles, lighting, and
# environments of this installation compared to the default model.
model:
  path: plus://6ea1f38db36e21f44a1eb1071d9958ed

# ---------------------------------------------------------------------------
# 1.8 MOTION – GLOBAL PRE-FILTER (runs before ML inference)
# ---------------------------------------------------------------------------
motion:
  threshold: 26                # Higher = less sensitive. 26 catches light changes
                               # while filtering most micro-movements (leaves, noise).
  contour_area: 30             # Minimum blob size to consider as motion (px²).
                               # Rejects isolated leaves and sensor noise.
  frame_alpha: 0.4             # Temporal smoothing — avoids reacting to single-frame spikes
  delta_alpha: 0.5
  improve_contrast: true       # Helps night/IR detection without penalising daytime

# ---------------------------------------------------------------------------
# 1.9 AUDIO – SECURITY-EVENT ANALYSIS
# ---------------------------------------------------------------------------
audio:
  enabled: true
  # min_volume thresholds:
  #   ~200  very sensitive (quiet indoor)
  #   ~350  typical outdoor background
  #   ~700+ noisy street-facing camera
  min_volume: 350

  # listen: is commented out — Frigate will log all recognised audio labels.
  # Once you confirm which labels appear, uncomment and restrict to:
  #   glass_breaking, gunshot_gunfire, explosion, scream, yell,
  #   smoke_alarm, fire_alarm, carbon_monoxide_alarm, car_alarm, siren

# ---------------------------------------------------------------------------
# 1.10 GO2RTC – PROXY VIA NUC go2rtc (192.168.50.112:8556)
# ---------------------------------------------------------------------------
# Frigate's internal go2rtc instance powers the web UI live view and provides
# streams to Frigate's ffmpeg inputs.
#
# Architecture:
#   Camera (RTSP) → NUC go2rtc (:8556) → Calypso go2rtc (here) → Frigate ffmpeg
#
# The NUC go2rtc acts as a single-connection proxy per camera, reducing direct
# RTSP load on the cameras. Calypso's go2rtc re-streams from the NUC.
#
# IMPORTANT – CROP STRATEGY:
#   go2rtc 1.9.10 cannot apply crop filters on its RTSP output. The
#   `#video=ffmpeg:` modifier is consumer-side only (WebRTC/MSE) and does NOT
#   affect the RTSP stream served to Frigate's ffmpeg. Therefore:
#   • No _left/_right go2rtc streams are registered — cropping is handled
#     entirely by Frigate's own ffmpeg, not go2rtc.
#   • Actual cropping is done by Frigate's own ffmpeg via
#     `ffmpeg.output_args.detect: [-vf, crop=W:H:X:Y]` per crop camera.
#   • Crop camera ffmpeg.inputs.path points to the full main stream
#     (rtsp://127.0.0.1:8554/<camera>_main), and Frigate crops before detect.
#
# NUC go2rtc RTSP endpoint: rtsp://go2rtc:go2rtc@192.168.50.112:8556/<stream>
#
# NUC stream name → Calypso logical name mapping:
#   reolink_duo_allee_cote_main/sub      → allee_sur_le_cote   (192.168.50.129)
#   reolink_duo_vue_sud_main/sub         → piscine_vue_toit    (192.168.50.7)
#   reolink_duo_jardin_devant_main/sub   → jardin_devant       (192.168.50.18)
#   reolink_vue_nord_sur_maison_main/sub → jardin_arriere      (192.168.50.207)
#   reolink_vue_entree_main/sub          → vue_entree          (192.168.50.222)
# ---------------------------------------------------------------------------
go2rtc:
  webrtc:
    # WebRTC achieves sub-200ms latency vs MSE.
    # Port 8555 must be reachable on the Calypso machine.
    candidates:
      - 192.168.50.150:8555
      - stun:8555

  streams:
    # ── Allée sur le côté — Reolink Duo 3 (192.168.50.129) ──────────────────
    # NUC stream names: reolink_duo_allee_cote_main / reolink_duo_allee_cote_sub
    # Main stream:  4096×1152  (full panoramic)
    # Sub stream:   1536×432   (full panoramic, live view only)
    # Half-crops:   2048×1152  each (cropped by Frigate ffmpeg output_args.detect)
    allee_sur_le_cote_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main
    allee_sur_le_cote_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_sub

    # ── Jardin arrière — Reolink RLC-810A single-lens (192.168.50.207) ──────
    # NUC stream names: reolink_vue_nord_sur_maison_main / reolink_vue_nord_sur_maison_sub
    # Main stream:  3840×2160  (4K UHD, used for detection + recording)
    # Sub stream:   640×360    (used for live view only)
    jardin_arriere_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_nord_sur_maison_main
    jardin_arriere_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_nord_sur_maison_sub

    # ── Vue entrée — Reolink Doorbell POE (192.168.50.222) ──────────────────
    # NUC stream names: reolink_vue_entree_main / reolink_vue_entree_sub
    # Main stream:  2560×1920  (4:3 aspect, used for detection + recording)
    # Sub stream:   640×480    (4:3 aspect, used for live view only)
    vue_entree_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_entree_main
    vue_entree_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_entree_sub

    # ── Jardin devant — Reolink Duo 3 (192.168.50.18) ───────────────────────
    # NUC stream names: reolink_duo_jardin_devant_main / reolink_duo_jardin_devant_sub
    # Main stream:  4096×1152  (full panoramic, used for recording)
    # Sub stream:   1536×432   (full panoramic, used for live view)
    # Half-crops:   2048×1152  each (cropped by Frigate ffmpeg output_args.detect)
    jardin_devant_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_main
    jardin_devant_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_sub

    # ── Piscine vue toit — Reolink Duo 3 (192.168.50.7) ────────────────────
    # NUC stream names: reolink_duo_vue_sud_main / reolink_duo_vue_sud_sub
    # Main stream:  4096×1152  (full panoramic)
    # Sub stream:   1536×432   (full panoramic, live view only)
    # Half-crops:   2048×1152  each (cropped by Frigate ffmpeg output_args.detect)
    piscine_vue_toit_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_vue_sud_main
    piscine_vue_toit_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_vue_sud_sub

# ============================================================================
# 2. CAMERA DEFINITIONS
# ============================================================================

cameras:

  # ==========================================================================
  # CAMERA: ALLEE_SUR_LE_COTE
  # Hardware:  Reolink Duo 3 Wi-Fi/ETH — 192.168.50.129
  # Height:    3.4m above ground
  # Tilt:      50° downward
  # Max dist:  20m (person detection at ground level)
  # FOV:       180° H-FOV / 55° V-FOV (panoramic Duo 3)
  # Position:  Driveway side view, covers gate + approach
  # Streams:
  #   detect  → sub 1536×432   (full panoramic sub-stream)
  #             NOTE: full panoramic used here for zone coverage across the
  #             entire driveway width. Left/right split cameras handle
  #             high-res detection for each half.
  #   record  → sub 1536×432   (same stream as detect — unified for efficiency)
  #   audio   → sub 1536×432   (same stream as detect — audio from sub-stream)
  #   live    → sub 1536×432   (lightweight for UI grid)
  # ==========================================================================
  allee_sur_le_cote:

    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/allee_sur_le_cote_sub
          roles: [detect, record, audio]  # unified: same stream for all roles

    live:
      streams:
        Allée côté (panoramique): allee_sur_le_cote_sub

    audio:
      enabled: true

    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false

    detect:
      # Sub-stream: 1536×432 (full panoramic, 3.56:1 aspect ratio)
      # Pixel density: 663,552 px total
      # fps=5: 3m shortest walkable dim → ~10.7 frames at 1.4 m/s (was 5, unchanged)
      width: 1536
      height: 432
      fps: 5

    objects:
      track: [person]
      filters:
        person:
          # iter0: physics-based — 160cm person at 20m on 1536×432 sub-stream
          min_area: 124
          max_area: 22500
          min_ratio: 1.0
          max_ratio: 4.0
          threshold: 0.55
          min_score: 0.45

    snapshots:
      enabled: true

    zones:
      prive:
        # Private driveway — immediate alert on entry
        coordinates:
          0.276,1,0,1,0,0.539,0.064,0.645,0.104,0.361,0.102,0.329,0.092,0.31,0.131,0.248,0.225,0.112,0.323,0,0.478,0,0.65,0,0.693,0.053,0.762,0.129,0.827,0.22,0.887,0.323,0.908,0.362,0.925,0.332,0.95,0.331,0.963,0.395,0.972,0.439,0.989,0.588,1,0.573,0.999,0.996
        loitering_time: 0
        inertia: 3
        objects: [person]
        filters:
          person:
            # iter0: physics-based — matches camera-level filter
            threshold: 0.55
            min_area: 124
            min_ratio: 1.0
            max_ratio: 4.0

      rodage:
        # Fence line — alert only after 10s loitering
        coordinates: 0.075,0.473,0.094,0.335,0.101,0.343,0.064,0.623,0.056,0.612
        loitering_time: 10
        inertia: 3
        objects: [person]
        filters:
          person:
            # iter0: physics-based — matches camera-level filter
            threshold: 0.55
            min_area: 124
            min_ratio: 1.0
            max_ratio: 4.0

    review:
      alerts:
        required_zones: prive
      detections:
        required_zones: rodage

  # ==========================================================================
  # CAMERA: ALLEE_SUR_LE_COTE_LEFT
  # Hardware:  Reolink Duo 3 — left lens half (same physical camera as above)
  # Height:    3.4m above ground (inherited from parent allee_sur_le_cote)
  # Max dist:  20m (inherited from parent)
  # FOV:       ~90° H-FOV / 55° V-FOV (half of 180° panoramic)
  # Position:  Left half of driveway — covers gate and street approach
  # Streams:
  #   detect  → main 4096×1152 pulled from go2rtc, cropped to left 2048×1152
  #             crop applied via CUDA filter graph (hwaccel_output_format cuda +
  #             crop,hwdownload,format=yuv420p) — GPU crop, CPU never sees full frame
  #   record  → main 4096×1152 (shared connection, Frigate deduplicates)
  #   audio   → main (shared)
  #   live    → sub 1536×432 (full panoramic sub for UI context)
  # ==========================================================================
  allee_sur_le_cote_left:

    ffmpeg:
      hwaccel_args:
        - -hwaccel
        - cuda
        - -hwaccel_device
        - '0'
        - -hwaccel_output_format
        - cuda
      output_args:
        detect:
          - -vf
          - hwdownload,format=nv12,format=yuv420p,crop=2048:1152:0:0
          - -f
          - rawvideo
          - -pix_fmt
          - yuv420p
      inputs:
        - path: rtsp://127.0.0.1:8554/allee_sur_le_cote_main
          roles: [detect]
      # record removed — parent allee_sur_le_cote records via sub stream

    record:
      enabled: false
    live:
      streams: {}  # Live view disabled — detection/recording/snapshots still active
                   # Half-crop cameras cause MSE rendering issues in the UI; the
                   # full panoramic (allee_sur_le_cote) is the primary live view.

    audio:
      enabled: false             # Audio captured by parent allee_sur_le_cote via sub stream


    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false

    detect:
      # main_left half-crop: 2048×1152 (16:9, left half of Duo 3 main)
      # Pixel density: 2,359,296 px total — 7× more than sub_left (768×432)
      # fps=7: 1.5m shortest walkable dim → ~7.5 frames at 1.4 m/s (was 10)
      width: 2048
      height: 1152
      fps: 7

    objects:
      track: [person]
      filters:
        person:
          # iter0: physics-based — 160cm person at 20m on 2048×1152 main crop
          min_area: 18
          max_area: 9000
          min_ratio: 1.0
          max_ratio: 4.0
          threshold: 0.55
          min_score: 0.45

    snapshots:
      enabled: true

    zones:
      prive:
        coordinates:
          1,1,1,0.002,0.703,0.002,0.506,0.112,0.496,0.124,0.486,0.12,0.464,0.138,0.322,0.239,0.254,0.296,0.244,0.32,0.234,0.329,0.226,0.336,0.247,0.363,0.155,0.694,0,0.568,0,1
        loitering_time: 0
        inertia: 3
        objects: [person]
        filters:
          person:
            # iter0: physics-based — matches camera-level filter
            threshold: 0.55
            min_area: 18
            min_ratio: 1.0
            max_ratio: 4.0
      rodage:
        coordinates: 0.231,0.382,0.198,0.348,0.111,0.635,0.151,0.665
        loitering_time: 10
        inertia: 3
        objects: [person]
        filters:
          person:
            # iter0: physics-based — matches camera-level filter
            threshold: 0.55
            min_area: 18
            min_ratio: 1.0
            max_ratio: 4.0

    review:
      alerts:
        required_zones: prive
      detections:
        required_zones: rodage

    motion:
      mask:
        0.587,0.002,0,0,0,0.533,0.107,0.629,0.194,0.345,0.199,0.315,0.207,0.292,0.308,0.2,0.398,0.127,0.41,0.117,0.422,0.097

  # ==========================================================================
  # CAMERA: ALLEE_SUR_LE_COTE_RIGHT
  # Hardware:  Reolink Duo 3 — right lens half (same physical camera as above)
  # Height:    3.4m above ground (inherited from parent allee_sur_le_cote)
  # Max dist:  20m (inherited from parent)
  # FOV:       ~90° H-FOV / 55° V-FOV (half of 180° panoramic)
  # Position:  Right half of driveway — covers garden side and rear approach
  # Streams:
  #   detect  → main 4096×1152 pulled from go2rtc, cropped to right 2048×1152
  #             crop applied via CUDA filter graph (hwaccel_output_format cuda +
  #             crop,hwdownload,format=yuv420p) — GPU crop, CPU never sees full frame
  #   record  → main 4096×1152 (shared connection, no second audio needed)
  #   live    → sub 1536×432 (full panoramic sub for UI context)
  # ==========================================================================
  allee_sur_le_cote_right:

    ffmpeg:
      hwaccel_args:
        - -hwaccel
        - cuda
        - -hwaccel_device
        - '0'
        - -hwaccel_output_format
        - cuda
      output_args:
        detect:
          - -vf
          - hwdownload,format=nv12,format=yuv420p,crop=2048:1152:2048:0
          - -f
          - rawvideo
