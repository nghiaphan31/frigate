  # ============================================================================
  # CAMERA: piscine_vue_toit
  # ============================================================================
  # HARDWARE
  #   Model:    Reolink Duo 3 Wi-Fi/ETH (dual-lens 4K panoramic)
  #   IP:       192.168.50.7
  #   RTSP:     admin:fG-56lui@192.168.50.7:8554
  #   Location: Piscine vue toit — pool rooftop, looking south over
  #             the pool and rear garden
  #
  # MOUNT GEOMETRY
  #   Height:        6.0 m above ground (roof / gutter mount)
  #   Tilt:          25° downward from horizontal
  #   H-FOV:         180°  (full panoramic)
  #   V-FOV:         55°
  #   Max walkable:  20 m (person at ground level, pool + garden)
  #   Min walkable:  5 m  (close-range, larger pixels)
  #
  # STREAMS (sub only for THIS camera; main is reserved for future
  # _left/_right half-crop cameras and is currently unused here)
  #   main: 4096×1152  (rtsp://.../h264Preview_01_main)  [NOT USED here]
  #   sub : 1536×432   (rtsp://.../h264Preview_01_sub)   [detect + record + audio + live]
  #   panoramic aspect ratio: 3.55:1
  #   sub pixel density: 663,552 px total
  #
  # Note on tilt choice:
  #   25° is much less steep than the allee/jardin_devant 50° tilt.
  #   The pool rooftop mount is significantly higher (6 m) and the
  #   target zone (pool + garden) is closer (5 m nearest), so a
  #   shallow tilt captures more of the FOV without losing the
  #   ground plane.  The downside: persons in the FOV appear
  #   larger in pixels (less foreshortening).
  #
  # FPS RATIONALE
  #   fps=5:  5 m shortest walkable dim → ~17.9 frames at 1.4 m/s.
  #
  # PHYSICS-DERIVED PERSON DETECTION (iter0 — geometry-based, May 2026)
  #   Target person:  H = 1.6 m tall, shoulder W = 0.5 m, aspect ≈ 2:1
  #
  #   Slant range at max distance (20 m):
  #     r = √(d² + h²) = √(20² + 6²) ≈ 20.88 m
  #   Elevation angle from camera to person at ground:
  #     α = arctan(h/d) = arctan(6/20) ≈ 16.70°
  #   Depression angle from optical axis to person:
  #     β = tilt − α = 25° − 16.70° = 8.30°
  #
  #   Pixel size of person at 20 m on sub 1536×432:
  #     H_px = (H / r) × (stream_h_px / V-FOV_rad) × cos(β)
  #         = (1.6 / 20.88) × (432 / 0.9599) × cos(8.30°)
  #         ≈ 34 px  (smallest expected footprint)
  #     W_px = (W / r) × (stream_w_px / H-FOV_rad) × cos(β)
  #         = (0.5 / 20.88) × (1536 / 3.1416) × cos(8.30°)
  #         ≈ 12 px
  #     area = H_px × W_px = 34 × 12 ≈ 396 px²
  #
  #   At 5 m near boundary:  area ≈ 2 886 px²  (largest expected footprint)
  #
  #   Applied filter values (iter0):
  #     min_area   =   396 × 0.399 = 158     (very low noise floor: wide FOV, shallow tilt)
  #     max_area   = 2 886 × 9.36  = 27 014  (very loose upper: person at 5 m is large in pixels)
  #     min_ratio  = 2.0 × 0.50   = 1.0      (50% of expected aspect)
  #     max_ratio  = 2.0 × 2.00   = 4.0      (200% of expected aspect)
  #     threshold  = 0.55                    (model default + 0.10)
  #     min_score  = 0.45                    (model default + 0.05)
  #
  # ZONES (zone filters mirror camera-level filter, no per-zone override)
  #   prive  — pool + garden, immediate alert on entry
  # ============================================================================
  piscine_vue_toit:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/piscine_vue_toit_sub
          roles: [detect, record, audio]  # unified: same stream for all roles
    live:
      streams:
        Piscine toit (panoramique): piscine_vue_toit_sub
    audio:
      enabled: true
    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false
    detect:
      width: 1536
      height: 432
      # Bumped 5 → 10 fps (2026-06-04, training-collection
      # relaxation). At 5 fps the motion pre-filter gets only ~3-4
      # chances per second to fire on a 1.4 m/s walker; 10 fps
      # doubles that and combined with the lower motion threshold
      # (5/255 below) closes the distance gap the iter0 contract
      # missed on this panoramic sub stream.
      #
      # Reduced 10 → 5 fps (2026-06-22, CPU fix). The 180°
      # panoramic sub stream has persistent noise (clouds, tree
      # branches, heat shimmer) that the motion pre-filter can't
      # reject by threshold alone — at 10 fps the detector was
      # invoked 3.4× per frame (detection_fps=34.4 vs
      # process_fps=10.1), driving process CPU to 45%. Halving
      # to 5 fps halves the detector invocations regardless of
      # motion region count. The 1.4 m/s walker still gets ~3-4
      # chances/sec at 5 fps (sufficient for the 20 m max
      # walkable distance).
      fps: 5
    objects:
      # Track BOTH person AND face (training-collection mode,
      # 2026-06-04). The global model.labelmap still rewrites
      # face→person for the UI, but the raw face bbox is kept for
      # Frigate+ training.
      track: [person, face]
      filters:
        person:
          # Training-collection relaxation (was iter0:
          # 158/27000/1.0/4.0/0.55/0.45). Rationale: a 20 m walker
          # on the 1536×432 panoramic sub stream is only 34×12
          # model-pixels after the 432/320 downscale — the iter0
          # contract under-counted at distance, so the motion
          # pre-filter (global threshold 26) AND the area/ratio/
          # score cutoffs all rejected the small but valid detection.
          min_area: 72          # ~50% of the 20 m footprint (158/2.2)
          max_area: 27000
          min_ratio: 0.5        # accept aspect variants (head-only, side)
          max_ratio: 8.0
          threshold: 0.30
          min_score: 0.25
        face:
          # Permissive override of the auto-generated 0.7/0.7 face filter
          min_area: 0
          max_area: 27000
          min_ratio: 0.0
          max_ratio: 8.0
          threshold: 0.30
          min_score: 0.25
      mask:
        - 0.002,0.991,0,0.003,0.295,0.006,0.23,0.172,0.247,0.381,0.094,0.991
        - 0.371,0,0.792,0.012,0.713,0.589,0.67,0.429,0.645,0.432,0.599,0.278,0.538,0.094,0.495,0.018,0.404,0.018,0.399,0.054,0.374,0.051
    snapshots:
      enabled: true
    motion:
      # Per-camera override (training-collection mode, 2026-06-04,
      # tightened 2026-06-22). The global motion.threshold=26 was
      # too high for the 1536×432 panoramic sub stream — a 20 m
      # walker produces only ~5-8 % per-pixel diff (vs the 10 %
      # required by threshold=26). The 2026-06-04 drop to 5/255 +
      # contour_area=10 caught the small distant motion but also
      # let through ~4 noise regions/frame (clouds, IR LED
      # switching, compression artefacts), causing
      # detection_fps=42.7 (4.23× process_fps) and process CPU=45%.
      # First tightening to 10/255 + contour_area=20 was
      # insufficient (detection_fps only dropped to 37.6, ratio
      # 3.76×) — the noise floor on this panoramic sub is above
      # 10/255. Final values 15/255 + contour_area=25: still
      # catches the 20 m walker (~5-8% diff > 15/255=5.9%
      # threshold) but rejects the persistent noise. Expected:
      # detection_fps → ~10-12, process CPU → ~10-15%.
      threshold: 15
      contour_area: 25
    zones:
      prive:
        # Pool + garden — immediate alert on entry
        coordinates: 
          0.097,1,0.178,0.715,0.249,0.38,0.245,0.3,0.243,0.249,0.233,0.173,0.27,0.084,0.291,0.031,0.301,0,0.316,0,0.37,0,0.374,0.059,0.387,0.059,0.4,0.059,0.405,0.021,0.495,0.021,0.534,0.098,0.587,0.257,0.615,0.338,0.629,0.406,0.642,0.445,0.652,0.454,0.666,0.453,0.681,0.499,0.691,0.576,0.703,0.609,0.713,0.611,0.796,0.006,0.999,0,0.998,0.994
        loitering_time: 0
        inertia: 3
        # Add face so face crops inside the prive zone count as
        # zone hits (rewritten to person by model.labelmap for the
        # UI, but Frigate+ sees the raw face box).
        objects: [person, face]
        filters:
          person:
            # Match the relaxed camera-level filter
            threshold: 0.30
            min_area: 72
            min_ratio: 0.5
            max_ratio: 8.0
          face:
            threshold: 0.30
            min_area: 0
            min_ratio: 0.0
            max_ratio: 8.0
    review:
      alerts:
        required_zones: prive
      detections:
        required_zones: prive

  # ============================================================================
  # CAMERA: salon (indoor, no detection, motion-tracking ON)
  # ============================================================================
  # HARDWARE
  #   Model:    TP-Link Tapo C210 (1/2.7" CMOS, 3 MP, 16:9 aspect, 2K QHD)
  #             3.83 mm fixed lens, motorised pan (360°) + tilt (114°),
  #             built-in mic, IR LED for night vision, microSD slot.
  #   IP:       192.168.50.17
  #   RTSP:     frigate_nghia:fG-56lui@192.168.50.17:554  (standard TP-Link port)
  #   Location: Indoor — living room (salon)
  #
  # ROOM GEOMETRY  (motion-tracking is ON; the static values below are the
  #                  DEFAULT orientation at boot. Once motion-tracking fires,
  #                  the camera pans/tilts to follow the person and the
  #                  actual mount orientation diverges from these defaults.)
  #   Room size:      5 m × 7 m   (typical living room)
  #   Mount:          Ceiling, 2.5 m above floor (corner of room, angled
  #                   inward to cover the seating area)
  #   Default tilt:   ~45° down from horizontal (looking at sofa area)
  #   H-FOV:          110°       (TP-Link spec for the C210 lens)
  #   V-FOV:          ~58°
  #   Max walkable:   ~6 m       (across the room from mount corner)
  #   Min walkable:   ~1 m       (just below the mount)
  #
  # STREAMS (standard TP-Link RTSP convention on port 554)
  #   main: 2304×1296  (rtsp://.../stream1)  [record + audio]
  #   sub : 640×360    (rtsp://.../stream2)  [live only]
  #   main pixel density: 2,985,984 px total
  #   sub  pixel density:   230,400 px total
  #
  # NO DETECTION (intentional, 2026-06-03)
  #   detect.enabled: false. Two reasons:
  #     1. The Tapo has motion-tracking ON at the device level — the
  #        camera physically moves. The iter0 physics-derived person
  #        filter (H_px / W_px / area) is only valid for a static
  #        mount orientation, so it's inapplicable while the camera
  #        is panning/tilting. A PTZ-aware spec would need to query
  #        the onvif PTZ position at inference time; not in scope here.
  #     2. Skipping the detect pass + NVDEC decode for the 2K main
  #        stream keeps the indoor CPU profile flat. The 3 indoor
  #        Tapo cams at 2K each would otherwise add ~3 × 4% CPU on
  #        top of the 5 outdoor Reolink cams.
  #   The motion pre-filter (step 6 of bring-up.sh) still runs, so
  #   motion-triggered recordings continue to work (record.motion.days=1).
  #
  #   To enable detection later: pin the camera in a static orientation
  #   (disable motion-tracking on the device side), or build a
  #   PTZ-aware detection model. NOT in scope for this branch.
  # ============================================================================
  salon:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/tapo_c210_salon_main
          roles: [record, audio]
    live:
      streams:
        Salon: tapo_c210_salon_sub
    audio:
      enabled: true
    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false
    detect:
      enabled: false
      width: 2304
      height: 1296
      fps: 10
    objects:
      track: []
      filters:
        person:
          # detection is disabled per-camera; these fields are present
          # only to satisfy the schema and the L1 test-config.sh
          # assertions (REQUIRED_CAMERA_KEYS / PERSON_FILTER_KEYS).
          # Values mirror the iter0 noise-floor defaults used by the
          # outdoor Reolink cameras; harmless because detect is OFF.
          min_area: 300
          max_area: 100000
          min_ratio: 1.0
          max_ratio: 4.0
          threshold: 0.55
          min_score: 0.45
    snapshots:
      enabled: true

