# ============================================================================
# Frigate NVR — global config (8 cameras, iter0 physics-based for outdoor)
# ============================================================================
# Frigate 0.17 schema. 8 cameras in this file:
#   5 outdoor Reolink (full physics-based detection, iter0):
#     - allee_sur_le_cote   (Reolink Duo 3, 3.4 m, 50° tilt, sub)
#     - jardin_arriere      (Reolink RLC-810A 4K, 2.2 m, 10° tilt)
#     - vue_entree          (Reolink Doorbell POE, 1.7 m, 0° tilt)
#     - jardin_devant       (Reolink Duo 3, 6 m, 50° tilt, panoramic sub)
#     - piscine_vue_toit    (Reolink Duo 3, 6 m, 25° tilt, panoramic sub)
#   3 indoor TP-Link Tapo C210 2K (record + audio only, NO detection):
#     - salon               (192.168.50.17, indoor — living room, 5×7m, 2.5m, PTZ motion-tracking)
#     - buro                (192.168.50.70, indoor — small office, 3.5×2.5m, 1m, PTZ motion-tracking)
#     - cuisine             (192.168.50.16, indoor — kitchen, 7×7m, 2.5m, PTZ motion-tracking)
#
# Two RTSP conventions in use (vendor-specific):
#   - Outdoor Reolink: rtsp://admin:fG-56lui@<ip>:8554/h264Preview_01_*
#     (Reolink-configured non-default RTSP port 8554 instead of 554).
#   - Indoor Tapo:     rtsp://frigate_nghia:fG-56lui@<ip>:554/stream*
#     (standard TP-Link port 554, /stream1 = main, /stream2 = sub).
#
# Indoor Tapo notes (2026-06-03):
#   - All 3 cameras have MOTION-TRACKING enabled on the device itself —
#     the Tapo will physically PAN+TILT to follow a person in the FOV.
#     This is a vendor-side feature; Frigate just records whatever the
#     lens is currently pointing at. The fixed "mount geometry" in each
#     camera block below documents the camera's DEFAULT orientation at
#     boot; once motion-tracking activates, the actual orientation
#     diverges. The fixed geometry is recorded for future reference
#     (e.g. when deriving a PTZ-aware detection spec).
#   - Detection is DISABLED per-camera (detect.enabled: false). Two
#     reasons: (1) PTZ motion invalidates the iter0 physics-derived
#     person filter (H_px / W_px / area change as the camera moves);
#     (2) the per-camera detect pass + NVDEC decode for the 2K main
#     stream are skipped, keeping the indoor CPU profile flat. The
#     motion pre-filter (step 6 of the 14-step status report) still
#     runs, so motion-triggered recordings continue to work.
#   - To enable detection later: pin the camera in a static orientation
#     (disable motion-tracking on the device), or build a PTZ-aware
#     detection model that queries the onvif PTZ position. Not in
#     scope for this branch.
#
# Global sections below are cluster-wide; per-camera overrides are
# under the `cameras:` block at the bottom of this file.
# See tests/camera_spec.py for the per-camera physics spec that
# drives the L2 test-math.sh assertions.
#
# Doc references (this repo):
#   - ARCHITECTURE.md §4   — per-stage pipeline details
#   - ARCHITECTURE.md §6.1 — config keys touched (by section)
#   - STARTUP.md §2.6     — Frigate+ API key prerequisite
#   - STARTUP.md §5.8     — failure-mode catalog (which check
#                              corresponds to which section, and
#                              which --recover=STRATEGY helps)
# ============================================================================

# ----------------------------------------------------------------------------
# mqtt — broker connection (used by Frigate's mqtt publisher thread for
#        event publication; see ARCHITECTURE.md §4.11)
# ----------------------------------------------------------------------------
# host/port: Home Assistant Mosquitto addon (HA on ha. local). Reachable
#            from Calypso at 192.168.50.125.
# user/pass: addon-managed creds (mirrored from HA's Mosquitto
#            configuration; "mosquitto" is a development credential,
#            change for production).
# client_id: MUST be unique per Frigate instance. Old configs that
#            omitted this caused the broker to evict the previous
#            session on every reconnect, producing "session taken
#            over" log lines and a 1-Hz disconnect loop. See
#            ARCHITECTURE.md §2.3 for the original bug history.
# topic_prefix: all Frigate MQTT events are published under
#            calypso_frigate/*. HA automations subscribe to
#            calypso_frigate/events and the bring-up script
#            publishes state telemetry to calypso_frigate/bringup/*.
# stats_interval: how often Frigate publishes its own status to MQTT
#            (in addition to events). 60s keeps broker traffic low
#            (the bring-up script reads /api/stats directly, so this
#            is mostly for HA dashboards and external observers).
# ----------------------------------------------------------------------------
mqtt:
  host: 192.168.50.125
  port: 1883
  user: mosquitto
  password: mosquitto
  client_id: frigate_calypso     # UNIQUE — this single line kills the takeover loop
  topic_prefix: calypso_frigate
  stats_interval: 60

# ----------------------------------------------------------------------------
# ffmpeg — global ffmpeg invocation settings (see ARCHITECTURE.md §4.3)
# ----------------------------------------------------------------------------
# path: version-pinned location of the ffmpeg binary. The
#       /usr/lib/ffmpeg/7.0/bin/ffmpeg symlink is created by
#       frigate-init.sh (the s6-overlay stage-2 hook in
#       docker-compose.calypso.yml) so Frigate can resolve
#       "ffmpeg.bin" without the versioned path. /usr/lib/ffmpeg
#       is the directory Frigate appends "/bin/ffmpeg" to.
# hwaccel_args: CUDA device selection for NVDEC. "-hwaccel cuda"
#       enables NVDEC; "-hwaccel_device 0" pins it to GPU 0
#       (the only GPU on Calypso — RTX 5060 Ti).
# output_args.record: the record-preset used when Frigate writes
#       segments to the NAS. preset-record-generic-audio-aac
#       transcodes to H.264 + AAC at the source-quality resolution;
#       for the sub stream (1536x432) this is cheap and keeps the
#       recordings browser-playable without re-encoding.
# ----------------------------------------------------------------------------
ffmpeg:
  path: /usr/lib/ffmpeg/7.0
  hwaccel_args:
    - -hwaccel
    - cuda
    - -hwaccel_device
    - '0'
  output_args:
    record: preset-record-generic-audio-aac

# ----------------------------------------------------------------------------
# record — continuous and motion-triggered recording retention
# ----------------------------------------------------------------------------
# enabled: master switch. When false, no segments are written at
#          all (Frigate runs detection + MQTT but the NAS is untouched).
# continuous.days: 0 = disabled. The single camera in this config
#          is motion-only — continuous recording of a 4K stream
#          would eat ~50 GB/day on the NAS for marginal value.
# motion.days: 1 = keep motion-triggered segments for 24 h after
#          the last motion event in them. Tuned for the 1-day
#          notification / review window common to home NVRs.
# ----------------------------------------------------------------------------
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 1

# ----------------------------------------------------------------------------
# snapshots — still-frame captures from events
# ----------------------------------------------------------------------------
# enabled: master switch.
# timestamp: burn a timestamp in the top-left of each snapshot.
# bounding_box: burn the detection's bounding box on the snapshot.
# clean_copy: also write a separate copy WITHOUT the bounding
#          box / timestamp burned in. Useful for publishing
#          un-incriminating images to public dashboards or
#          sharing snapshots without exposing the camera geometry.
# crop: false = full-frame snapshots (the camera-level override
#          re-affirms this). The bounding box is painted on the
#          full frame, so the operator sees the wider context.
# retain.default: 0 = delete snapshots immediately when their
#          event is closed, unless a per-object override applies.
#          (We have one such override: person: 7 days.)
# retain.objects.person: 7 = keep person-event snapshots for a
#          week. This is the only category worth keeping for
#          the "allee" camera; everything else (car, animal, etc.)
#          is transient.
# ----------------------------------------------------------------------------
snapshots:
  enabled: true
  timestamp: true
  bounding_box: true
  clean_copy: true
  crop: false
  retain:
    default: 0
    objects:
      person: 7

# ----------------------------------------------------------------------------
# objects — global object tracking and filter defaults
# ----------------------------------------------------------------------------
# track: only `person` is tracked globally. The camera block
#        re-asserts this so the per-camera config is self-contained.
# filters.person: a LOOSE default filter applied to any camera
#        that doesn't override it. min_area=300 is conservative
#        (the per-camera allee filter is tighter, 124-22500 px²,
#        derived from the camera's geometry — see the cameras
#        block below). max_area=100000 catches the rare false
#        positive where a 4K-zoomed-in blob fills the frame.
#        min_score=0.40 + threshold=0.45 are the model defaults
#        +0.05 above the model's pre-trained cutoffs, suppressing
#        the lowest-confidence detections.
# ----------------------------------------------------------------------------
objects:
  track:
    - person
  filters:
    person:
      min_area: 300
      min_score: 0.40
      threshold: 0.45
      max_area: 100000

# ----------------------------------------------------------------------------
# detect — global enable flag for detection (camera-level can override)
# ----------------------------------------------------------------------------
# enabled: true here sets the default; allee_sur_le_cote in the
#          cameras block does not override, so it inherits this.
#          (Camera-level `detect.enabled` is omitted intentionally —
#          if we ever add a second camera that needs to opt out of
#          detection, that override would go there.)
# ----------------------------------------------------------------------------
detect:
  enabled: true

# ----------------------------------------------------------------------------
# detectors — ONNX runtime + TensorRT execution provider
# ----------------------------------------------------------------------------
# onnx1: the single detector. `type: onnx` selects the ONNX
#        Runtime as the inference engine (with TensorRT as the
#        EP via `device: "Tensorrt"`). The TRT engine is built
#        on first start (~65 s on the RTX 5060 Ti) and cached at
#        /config/model_cache/tensorrt/ort/trt-engines/. If the
#        engine is corrupt, see STARTUP.md §5.3 for the rebuild
#        recipe (or use --recover=rebuild-trt).
# ----------------------------------------------------------------------------
detectors:
  onnx1:
    type: onnx
    device: Tensorrt

# ----------------------------------------------------------------------------
# model — Frigate+ custom detection model
# ----------------------------------------------------------------------------
# path: plus://<hash> pulls a Frigate+-trained model (custom to
#       this camera's geometry, see the cameras block). The 28 MB
#       model binary is downloaded once into trt-cache/ (gitignored,
#       see .gitignore). Without a valid FRIGATE_PLUS_API_KEY in .env,
#       Frigate falls back to the generic SSD model — which works
#       but has a higher false-positive rate on this Reolink's
#       panoramic sub stream.
# ----------------------------------------------------------------------------
model:
  path: plus://c1aa04320f389aa6c7702bf9ddd3fe6d

# ----------------------------------------------------------------------------
# motion — pre-filter thresholds (see ARCHITECTURE.md §4.6)
# ----------------------------------------------------------------------------
# Frigate runs this lightweight filter on every frame BEFORE the
# expensive ONNX/TensorRT detector. If the filter says "no motion
# here", the detector is skipped. The thresholds below are tuned
# to be aggressive enough to catch a person walking 20 m away in
# the allee_sur_le_cote camera; false positives are cheap to reject
# downstream (the person filter).
#
# threshold: pixel-difference threshold (0-255). 26 = subtle motion
#           (e.g. a person at the far end of the alley, ~3% pixel
#           delta). 20 was too sensitive (clouds moving triggered
#           it); 30 was too lax (slow walkers missed at 20 m).
# contour_area: minimum bounding-box area (in pixels²) for a
#           detected motion blob. 30 filters out sensor noise
#           and compression artefacts.
# frame_alpha: EMA factor for the running frame average. 0.4 =
#           40% weight on the previous average, 60% on the new
#           frame. Higher = more stable baseline (slower to adapt
#           to lighting changes), lower = faster adaptation but
#           more noise.
# delta_alpha: same as frame_alpha but for the per-pixel delta
#           history. 0.5 = balanced.
# improve_contrast: 0.4× stretch the frame's histogram before
#           differencing. Crucial for the allee camera which has
#           strong backlight contrast (the camera faces west; sun
#           is in the FOV for half the day).
# ----------------------------------------------------------------------------
motion:
  threshold: 26
  contour_area: 30
  frame_alpha: 0.4
  delta_alpha: 0.5
  improve_contrast: true

# ----------------------------------------------------------------------------
# audio — audio-event detection (see ARCHITECTURE.md §4.16)
# ----------------------------------------------------------------------------
# enabled: enable audio detection on the sub stream's audio track.
# min_volume: 0-32768 raw PCM threshold. 350 is just above the
#           sub stream's noise floor (camera's built-in mic, some
#           mains hum from the gate motor at ~340). Lower than 300
#           triggers on the fridge compressor in the kitchen
#           (out of FOV but the mic picks it up). Higher than 400
#           misses quiet speech at 20 m.
# ----------------------------------------------------------------------------
audio:
  enabled: true
  min_volume: 350

# ----------------------------------------------------------------------------
# go2rtc — internal re-streamer (see ARCHITECTURE.md §4.2)
# ----------------------------------------------------------------------------
# webrtc.candidates: the WebRTC ICE candidates go2rtc advertises
#   to the browser. The Tailscale IP (192.168.50.150) is the
#   primary, so browser live-view works from any Tailscale node
#   without STUN/TURN. "stun:8555" is a fallback for off-Tailscale
#   browsers.
# streams.allee_sur_le_cote_sub: the RTSP URL the allee camera's
#   ffmpeg inputs (in the cameras block below) read from. The
#   Frigate container itself connects to 127.0.0.1:8554 (the
#   go2rtc-internal endpoint), NOT directly to the Reolink. This
#   gives us:
#     - shared stream between detect, record, and audio roles
#       (one RTSP session, three roles)
#     - low-latency re-streaming for the WebRTC live view in
#       the Frigate web UI
#     - central place to add cameras later (one more entry here,
#       one more cameras block below)
#   Credentials are baked into the URL here, NOT in the env.
#   See .gitignore (trt-libs/, etc.) for what is and isn't
#   committed; the RTSP creds are deliberately tracked in git
#   because this is a private LAN, the camera is in a tamper-
#   resistant enclosure, and rotating them requires re-deploying
#   every host that references the URL.
# ----------------------------------------------------------------------------
go2rtc:
  webrtc:
    candidates:
      - 192.168.50.150:8555
      - stun:8555
  streams:
    allee_sur_le_cote_sub:
      - rtsp://admin:fG-56lui@192.168.50.129:8554/h264Preview_01_sub

    # ── Jardin arrière — Reolink RLC-810A single-lens (192.168.50.207) ─────
    # Main stream:  3840×2160  (4K UHD, used for detection + recording)
    # Sub stream:   640×360    (used for live view only)
    jardin_arriere_main:
      - rtsp://admin:fG-56lui@192.168.50.207:8554/h264Preview_01_main
    jardin_arriere_sub:
      - rtsp://admin:fG-56lui@192.168.50.207:8554/h264Preview_01_sub

    # ── Vue entrée — Reolink Doorbell POE (192.168.50.222) ─────────────
    # Main stream:  2560×1920  (4:3, used for detection + recording)
    # Sub stream:   640×480    (4:3, used for live view only)
    vue_entree_main:
      - rtsp://admin:fG-56lui@192.168.50.222:8554/h264Preview_01_main
    vue_entree_sub:
      - rtsp://admin:fG-56lui@192.168.50.222:8554/h264Preview_01_sub

    # ── Jardin devant — Reolink Duo 3 (192.168.50.18) ─────────────────
    # Main stream:  4096×1152  (panoramic, 3.5:1) — used for recording
    # Sub stream:   1536×432   (panoramic, 3.5:1) — used for detection
    # (panoramic sub for full overview; _left/_right half-crop cameras
    # are a separate concern and are NOT added in this branch)
    jardin_devant_main:
      - rtsp://admin:fG-56lui@192.168.50.18:8554/h264Preview_01_main
    jardin_devant_sub:
      - rtsp://admin:fG-56lui@192.168.50.18:8554/h264Preview_01_sub

    # ── Piscine vue toit — Reolink Duo 3 (192.168.50.7) ────────────────
    # Main stream:  4096×1152  (panoramic, 3.5:1) — record + audio only
    # Sub stream:   1536×432   (panoramic, 3.5:1) — detect (full panoramic overview)
    # (panoramic sub for full overview; _left/_right half-crop cameras
    # are a separate concern and are NOT added in this branch)
    piscine_vue_toit_main:
      - rtsp://admin:fG-56lui@192.168.50.7:8554/h264Preview_01_main
    piscine_vue_toit_sub:
      - rtsp://admin:fG-56lui@192.168.50.7:8554/h264Preview_01_sub

    # ── TP-Link Tapo C210 2K indoor cameras (added 2026-06-03) ────────────
    # Standard RTSP on port 554 (/stream1 = 2304×1296 main, /stream2 = 640×360 sub).
    # Used as record + audio only; no detect role. Credentials differ from
    # the outdoor Reolink cams (frigate_nghia / fG-56lui, Tapo account).
    # All 3 cameras have MOTION-TRACKING enabled on-device (PTZ follows
    # the person in the FOV); the RTSP endpoint stays the same, only the
    # pixel content changes as the camera moves. Recordings will show
    # whatever the lens was pointed at when motion fired.
    tapo_c210_salon_main:
      - rtsp://frigate_nghia:fG-56lui@192.168.50.100:554/stream1
    tapo_c210_salon_sub:
      - rtsp://frigate_nghia:fG-56lui@192.168.50.100:554/stream2

    tapo_c210_buro_main:
      - rtsp://frigate_nghia:fG-56lui@192.168.50.69:554/stream1
    tapo_c210_buro_sub:
      - rtsp://frigate_nghia:fG-56lui@192.168.50.69:554/stream2

    tapo_c210_cuisine_main:
      - rtsp://frigate_nghia:fG-56lui@192.168.50.16:554/stream1
    tapo_c210_cuisine_sub:
      - rtsp://frigate_nghia:fG-56lui@192.168.50.16:554/stream2

cameras:

  # ============================================================================
  # ZONE INERTIA POLICY (2026-07-31 walk test finding)
  # ============================================================================
  # Frigate's zone check requires the detection bbox to be in the zone
  # for N consecutive frames before the zone is registered (where N is
  # the zone's `inertia` setting). At the iter0 contract (5-7 fps, a
  # 1.4 m/s walker spends 0.4-0.7 s in a typical 1-2 m zone), inertia=3
  # means the walker must be in the zone for 3 consecutive frames —
  # and any missed-frame gap (compression artefact, IR noise, brief
  # motion-pre-filter false-negative) drops the count to 2 and the
  # zone hit is lost. The 2026-07-31 walk test captured 6 detections
  # on vue_entree where my point-in-polygon test said 4/6 bottom-
  # centers were inside the prive zone, but Frigate reported
  # zones=[] for all 6 — consistent with single-pass walkers not
  # meeting the 3-frame requirement.
  #
  # Policy applied in this commit:
  #   - ALERT zones (loitering_time: 0):  inertia=1 (was 3). Single-
  #     pass alerts fire on the first frame the detection is in the
  #     zone. The False-Positive risk is low because the camera-level
  #     person filter (threshold 0.55, min_score 0.45) already rejects
  #     the noise-floor detections.
  #   - LOITER zones (loitering_time: 10): inertia=3 (unchanged). The
  #     10s loitering requirement is the long-form suppression; 3-frame
  #     inertia is a secondary guard against one-frame noise triggering
  #     a 10s timer.
  #
  # Verification (2026-07-31 walk test, post-fix): re-walk the same
  # paths and re-run `make iter0-diff-all` + the live event API to
  # confirm the prive zone hits now register for single-pass walkers.
  # ============================================================================

  # ============================================================================
  # CAMERA: allee_sur_le_cote
  # ============================================================================
  # HARDWARE
  #   Model:    Reolink Duo 3 Wi-Fi/ETH (dual-lens 4K panoramic)
  #   IP:       192.168.50.129
  #   RTSP:     admin:fG-56lui@192.168.50.129:8554
  #   Location: Allée côté — driveway side view, covers gate + approach
  #
  # MOUNT GEOMETRY
  #   Height:        3.4 m above ground
  #   Tilt:          50° downward from horizontal
  #   H-FOV:         180° (full panoramic) / ~90° per half
  #   V-FOV:         55°
  #   Max walkable:  20 m (person at ground level)
  #   Min walkable:  3 m  (close-range, larger pixels)
  #
  # STREAMS (sub only — main is unused in this config)
  #   main: 4096×1152  (rtsp://.../h264Preview_01_main)  [NOT USED]
  #   sub : 1536×432   (rtsp://.../h264Preview_01_sub)   [detect + record + audio]
  #   panoramic aspect ratio: 3.56:1
  #   sub pixel density: 663,552 px total
  #
  # FPS RATIONALE
  #   fps=5:  at 1.4 m/s walking speed, a person crosses the 3 m near boundary
  #           in 3/1.4 ≈ 2.14 s → ~10.7 frames captured during the crossing.
  #           Slow enough for reliable detection, fast enough to track motion.
  #
  # PHYSICS-DERIVED PERSON DETECTION (iter0 — geometry-based, May 2026)
  #   Target person:  H = 1.6 m tall, shoulder W = 0.5 m, aspect ratio ≈ 2:1
  #
  #   Slant range at max distance (20 m):
  #     r = √(d² + h²) = √(20² + 3.4²) ≈ 20.29 m
  #   Elevation angle from camera to person at ground:
  #     α = arctan(h/d) = arctan(3.4/20) ≈ 9.65°
  #   Depression angle from optical axis to person:
  #     β = tilt − α = 50° − 9.65° = 40.35°
  #
  #   Pixel size of person at 20 m on sub 1536×432:
  #     H_px = H × (V-FOV / H_pixels) × cos(β)
  #         = 1.6 × (55/432) × cos(40.35°)
  #         ≈ 31 px  (smallest expected footprint)
  #     W_px = W × (H-FOV / W_pixels) × cos(β)
  #         = 0.5 × (180/1536) × cos(40.35°)
  #         ≈ 8 px
  #     area = H_px × W_px = 31 × 8 ≈ 248 px²
  #
  #   At 3 m near boundary:  area ≈ 15,000 px²  (largest expected footprint)
  #
  #   Applied filter values (with safety margins):
  #     min_area   = 248 × 0.50   = 124     (50% of smallest expected)
  #     max_area   = 15,000 × 1.50 = 22,500  (150% of largest expected)
  #     min_ratio  = 2.0 × 0.50   = 1.0     (50% of expected aspect)
  #     max_ratio  = 2.0 × 2.00   = 4.0     (200% of expected aspect)
  #     threshold  = 0.55         (model default + 0.10)
  #     min_score  = 0.45         (model default + 0.05)
  #
  # ZONES (zone filters mirror camera-level filter, no per-zone override)
  #   prive  — private driveway, immediate alert on entry
  #   rodage — fence line, alert only after 10 s loitering
  # ============================================================================
  allee_sur_le_cote:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/allee_sur_le_cote_sub
          roles: [detect, record, audio]
    live:
      streams:
        Allée côté (panoramique): allee_sur_le_cote_sub
    audio:
      enabled: true
    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false
    detect:
      width: 1536
      height: 432
      fps: 5
    objects:
      track: [person]
      filters:
        person:
          min_area: 124
          max_area: 22500
          min_ratio: 1.0
          max_ratio: 4.0
          threshold: 0.55
          min_score: 0.45
      mask:
        - 0.002,0.526,0.005,0,0.304,0,0.091,0.305,0.098,0.36,0.064,0.625
        - 0.655,-0.003,0.856,-0.003,0.856,0.26,0.779,0.136
    snapshots:
      enabled: true
    zones:
      prive:
        coordinates: 
          0.276,1,0,1,0,0.539,0.064,0.645,0.104,0.361,0.102,0.329,0.092,0.31,0.131,0.248,0.225,0.112,0.323,0,0.478,0,0.65,0,0.693,0.053,0.762,0.129,0.827,0.22,0.887,0.323,0.908,0.362,0.925,0.332,0.95,0.331,0.963,0.395,0.972,0.439,0.989,0.588,1,0.573,0.999,0.996
        loitering_time: 0
        inertia: 1
        objects: [person]
        filters:
          person:
            threshold: 0.55
            min_area: 124
            min_ratio: 1.0
            max_ratio: 4.0
      rodage:
        coordinates: 0.075,0.473,0.094,0.335,0.101,0.343,0.064,0.623,0.056,0.612
        loitering_time: 10
        inertia: 3
        objects: [person]
        filters:
          person:
            threshold: 0.55
            min_area: 124
            min_ratio: 1.0
            max_ratio: 4.0
    review:
      alerts:
        required_zones: prive
      detections:
        required_zones: rodage

  # ============================================================================
  # CAMERA: jardin_arriere
  # ============================================================================
  # HARDWARE
  #   Model:    Reolink RLC-810A (4.0 mm fixed lens, single-sensor 4K bullet)
  #   IP:       192.168.50.207
  #   RTSP:     admin:fG-56lui@192.168.50.207:8554
  #   Location: Jardin arrière — rear garden, north-facing, covers play
  #             area + shed
  #
  # MOUNT GEOMETRY
  #   Height:        2.2 m above ground
  #   Tilt:          10° downward from horizontal
  #   H-FOV:         87°  (RLC-810A 4.0 mm lens)
  #   V-FOV:         44°
  #   Max walkable:  20 m (person at ground level)
  #   Min walkable:  5 m  (close-range, larger pixels)
  #
  # STREAMS (main = 4K UHD for detect + record; sub = 640×360 for live)
  #   main: 3840×2160  (rtsp://.../h264Preview_01_main)  [detect + record + audio]
  #   sub : 640×360    (rtsp://.../h264Preview_01_sub)   [live only]
  #   main pixel density: 8,294,400 px total
  #   sub  pixel density:   230,400 px total
  #
  # FPS RATIONALE
  #   fps=5:  5 m shortest walkable dim → ~17.9 frames at 1.4 m/s.
  #           4K at 10 fps wastes GPU decode time (NVDEC saturates at
  #           ~5 fps for 3840×2160 with hwaccel_output_format cuda)
  #           AND the model input is 320×320 — 8x more pixels decoded
  #           than the model consumes. 5 fps is the sweet spot.
  #
  # PHYSICS-DERIVED PERSON DETECTION (iter0 — geometry-based, May 2026)
  #   Target person:  H = 1.6 m tall, shoulder W = 0.5 m, aspect ≈ 2:1
  #
  #   Slant range at max distance (20 m):
  #     r = √(d² + h²) = √(20² + 2.2²) ≈ 20.12 m
  #   Elevation angle from camera to person at ground:
  #     α = arctan(h/d) = arctan(2.2/20) ≈ 6.28°
  #   Depression angle from optical axis to person:
  #     β = tilt − α = 10° − 6.28° = 3.72°
  #
  #   Pixel size of person at 20 m on main 3840×2160:
  #     H_px = (H / r) × (stream_h_px / V-FOV_rad) × cos(β)
  #         = (1.6 / 20.12) × (2160 / 0.7680) × cos(3.72°)
  #         ≈ 223 px  (smallest expected footprint)
  #     W_px = (W / r) × (stream_w_px / H-FOV_rad) × cos(β)
  #         = (0.5 / 20.12) × (3840 / 1.5184) × cos(3.72°)
  #         ≈ 63 px
  #     area = H_px × W_px = 223 × 63 ≈ 14 016 px²
  #
  #   At 5 m near boundary:  area ≈ 190 838 px²  (largest expected footprint)
  #
  #   Applied filter values (iter0 — noise-floor on min, conservative on max):
  #     min_area   = 14 016 × 0.022 = 308     (noise floor: catches ~3 m person on 4K)
  #     max_area   = 190 838 × 0.61 = 116 411  (rejects anything bigger than a person at 5 m)
  #     min_ratio  = 2.0 × 0.50   = 1.0       (50% of expected aspect)
  #     max_ratio  = 2.0 × 2.00   = 4.0       (200% of expected aspect)
  #     threshold  = 0.55                     (model default + 0.10)
  #     min_score  = 0.45                     (model default + 0.05)
  #
  # ZONES (zone filters mirror camera-level filter, no per-zone override)
  #   prive  — play area + shed, immediate alert on entry
  # ============================================================================
  jardin_arriere:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/jardin_arriere_main
          roles: [detect, record, audio]
    live:
      streams:
        Jardin arrière: jardin_arriere_sub
    audio:
      enabled: true
    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false
    detect:
      width: 1920
      height: 1080
      # Reduced 3840×2160 → 1920×1080 (2026-06-22, CPU fix).
      # The 4K main stream was decoded to rawvideo at 10 fps for
      # detection, driving the ffmpeg process to 22% CPU (pid 1427,
      # cpu_average=22%). The model is yolov9s at 640×640 input,
      # so 4K detection is wasteful — NVDEC decodes 8.3M pixels/
      # frame only to have Frigate downsample to 640×640 (1.5% of
      # the original). Halving each dimension cuts the pixel count
      # by 4× (8.3M → 2.1M) and the ffmpeg CPU by ~50-60%
      # (22% → ~8-10%). The recording still uses the full 4K main
      # stream (no quality loss for recordings).
      #
      # fps=5 (iter0 contract restored 2026-07-31). The 10 fps used
      # during the 2026-06-04 → 2026-07-30 training-collection period
      # was a temporary relaxation that doubled the detector-call
      # rate to widen the net for Frigate+ labelling. The new
      # plus://c1aa04320f389aa6c7702bf9ddd3fe6d yolonas model is
      # trained on that wider net, so the iter0 contract is again
      # the right production setting.
      fps: 5
    objects:
      track: [person]
      filters:
        person:
          # iter0 contract (restored 2026-07-31)
          min_area: 300
          max_area: 117000
          min_ratio: 1.0
          max_ratio: 4.0
          threshold: 0.55
          min_score: 0.45
      mask:
        0.002,0.005,0.994,0.005,0.999,0.158,0.752,0.207,0.695,0.113,0.657,0.321,0.527,0.321,0.535,0.152,0.522,0.118,0.48,0.124,0.459,0.198,0.411,0.164,0.389,0.11,0.318,0.107,0.263,0.054,0.254,0.104,0.248,0.287,0.233,0.354,0.166,0.416,0.098,0.379,0.075,0.345,0,0.345
    snapshots:
      enabled: true
    motion:
      # Per-camera threshold override (night mode, kept 2026-07-31 as
      # a deliberate production value, not a training-collection
      # artefact). The 30/255 value was chosen because the global
      # default of 26/255 was overwhelmed by IR-mode noise on this
      # 4K main stream (every IR-illuminated foliage blob + every
      # compression artefact on 8.3 M pixels/frame at 5 fps registered
      # as motion; the iter0 person filter (min_area: 300,
      # min_score: 0.45) then confirmed many of those as events).
      #
      # At 30/255 (~12 % per-pixel diff) we:
      #   - CATCH walkers at 5-7 m (5-10 % diff, borderline)
      #   - MISS walkers at 10 m+ (2-5 % diff)
      #   - SUPPRESS most night noise (IR sensor noise 1-3 %,
      #     compression artefacts 1-5 %)
      #
      # Trade-off: this camera is less sensitive at night than the
      # global default. Acceptable because the 5 m walkable zone is
      # the primary alert zone (prive); distant walkers (>10 m)
      # were always in the "review" category, not "alert", and can
      # be reviewed in the morning. If we want to recover some of
      # the 10-20 m range later, the right path is a day/night
      # split config, not a lower threshold (which would bring the
      # noise storm back).
      threshold: 30
      mask:
        # Trees and fence reflections that trigger false motion events
        - 0.087,0.123,0.065,0.241,0.072,0.32,0.095,0.365,0.155,0.411,0.198,0.384,0.231,0.336,0.245,0.301,0.222,0.262,0.22,0.215,0.208,0.163,0.189,0.131,0.158,0.122,0.13,0.12
        - 0.429,0.073,0.45,0.078,0.471,0.126,0.47,0.158,0.453,0.188,0.429,0.179,0.412,0.143,0.398,0.115
        - 0.626,0.271,0.645,0.276,0.645,0.313,0.626,0.312
        - 0.589,0.265,0.605,0.268,0.604,0.298,0.587,0.293
        - 0.535,0.258,0.558,0.264,0.555,0.321,0.529,0.314
        - 0.149,0.017,0.253,0.021,0.253,0.07,0.15,0.063
        - 0.351,0.061,0.367,0.028,0.392,0.023,0.414,0.036,0.424,0.061,0.392,0.067
      contour_area: 30
      improve_contrast: true
    zones:
      prive:
        # Play area + shed — immediate alert on entry
        coordinates: 
          0,1,0.002,0.354,0.239,0.343,0.26,0.044,0.287,0.071,0.304,0.092,0.314,0.115,0.524,0.124,0.537,0.166,0.544,0.143,0.606,0.157,0.693,0.118,0.748,0.21,1,0.164,0.997,0.997
        loitering_time: 0
        inertia: 1
        objects: [person]
        filters:
          person:
            # min_area 300 (iter0) → 500 (deliberate 2026-06-05
            # tightening, kept 2026-07-31). The 4K main stream at
            # 15-20 m can produce noise-floor bboxes in the 300-500
            # px² band that the iter0 contract lets through; bumping
            # the in-zone floor to 500 suppresses them without
            # affecting close-range (5 m) detection.
            threshold: 0.55
            min_area: 500
            min_ratio: 1.0
            max_ratio: 4.0
    review:
      alerts:
        required_zones: prive
      detections:
        required_zones: prive

  # ============================================================================
  # CAMERA: vue_entree
  # ============================================================================
  # HARDWARE
  #   Model:    Reolink Doorbell POE (1/2.7" CMOS, 5 MP, 4:3 aspect)
  #   IP:       192.168.50.222
  #   RTSP:     admin:fG-56lui@192.168.50.222:8554
  #   Location: Front door / entry walkway — eye-level view of visitors
  #
  # MOUNT GEOMETRY
  #   Height:        1.7 m above ground (doorbell at face height)
  #   Tilt:          0°  (level — no downward tilt; doorbell designed
  #                       for face-to-face view)
  #   H-FOV:         135°  (Doorbell POE wide-angle lens)
  #   V-FOV:         100°
  #   Max walkable:  20 m (person at ground level, ~3 m to door)
  #   Min walkable:  3 m  (close-range at the doorstep)
  #
  # STREAMS (main = 2560×1920 4:3 for detect + record; sub = 640×480 for live)
  #   main: 2560×1920  (rtsp://.../h264Preview_01_main)  [detect + record + audio]
  #   sub : 640×480    (rtsp://.../h264Preview_01_sub)   [live only]
  #   main pixel density: 4,915,200 px total
  #   sub  pixel density:   307,200 px total
  #
  # FPS RATIONALE
  #   fps=7:  3 m shortest walkable dim → ~15 frames at 1.4 m/s.
  #           4:3 aspect at 7 fps gives a comfortable frame budget
  #           for the wide-angle lens (135° H-FOV); 5 fps would lose
  #           visitors who walk across the FOV in <0.5 s.
  #
  # PHYSICS-DERIVED PERSON DETECTION (iter0 — geometry-based, May 2026)
  #   Target person:  H = 1.6 m tall, shoulder W = 0.5 m, aspect ≈ 2:1
  #
  #   Slant range at max distance (20 m):
  #     r = √(d² + h²) = √(20² + 1.7²) ≈ 20.07 m
  #   Elevation angle from camera to person at ground:
  #     α = arctan(h/d) = arctan(1.7/20) ≈ 4.86°
  #   Depression angle from optical axis to person:
  #     β = tilt − α = 0° − 4.86° = −4.86° (person is ABOVE optical axis)
  #     → clamped to 0° for the iter0 formula (foreshortening ignored
  #       for the rare case of a level-tilt camera looking at distant
  #       ground)
  #
  #   Pixel size of person at 20 m on main 2560×1920:
  #     H_px = (H / r) × (stream_h_px / V-FOV_rad) × cos(β)
  #         = (1.6 / 20.07) × (1920 / 1.7453) × cos(0°)
  #         ≈ 88 px  (smallest expected footprint)
  #     W_px = (W / r) × (stream_w_px / H-FOV_rad) × cos(β)
  #         = (0.5 / 20.07) × (2560 / 2.3562) × cos(0°)
  #         ≈ 27 px
  #     area = H_px × W_px = 88 × 27 ≈ 2 377 px²
  #
  #   At 3 m near boundary:  area ≈ 80 340 px²  (largest expected footprint)
  #
  #   Applied filter values (iter0 — noise floor + conservative upper):
  #     min_area   = 2 377 × 0.126 = 300     (noise floor: catches ~3 m person on 4:3 main)
  #     max_area   = 80 340 × 1.79 = 143 808 (rejects anything bigger than a person at 3 m)
  #     min_ratio  = 2.0 × 0.50   = 1.0      (50% of expected aspect)
  #     max_ratio  = 2.0 × 2.00   = 4.0      (200% of expected aspect)
  #     threshold  = 0.55                     (model default + 0.10)
  #     min_score  = 0.45                     (model default + 0.05)
  #
  # ZONES (zone filters mirror camera-level filter, no per-zone override)
  #   prive  — entry walkway + doorstep, immediate alert on entry
  # ============================================================================
  vue_entree:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/vue_entree_main
          roles: [detect, record, audio]
    live:
      streams:
        Vue entrée: vue_entree_sub
    audio:
      enabled: true
    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false
    detect:
      width: 2560
      height: 1920
      # fps=7 (iter0 contract restored 2026-07-31, after the
      # plus://c1aa04320f389aa6c7702bf9ddd3fe6d model was issued).
      # The 10 fps used during the 2026-06-04 → 2026-07-30
      # training-collection period doubled the detector-call rate
      # to widen the net for Frigate+ labelling; the new model is
      # now trained on that wider net, so the iter0 contract is
      # again the right production setting.
      fps: 7
    objects:
      track: [person]
      filters:
        person:
          # iter0 contract (restored 2026-07-31). See
          # config.yml:736-766 for the physics derivation
          # (1.6 m person at 3-20 m on 2560×1920 main stream).
          min_area: 300
          max_area: 144000
          min_ratio: 1.0
          max_ratio: 4.0
          threshold: 0.55
          min_score: 0.45
      mask: 0.806,0.142,0.864,0.449,0.927,0.444,0.876,0.219
    snapshots:
      enabled: true
    motion:
      # No per-camera motion override (restored 2026-07-31). The
      # training-collection per-camera threshold: 10/255 was a
      # temporary relaxation to widen the net for Frigate+ labelling
      # on the doorbell; the new yolonas model is trained on the
      # wider net and the global default 26/255 is again correct.
      # The motion mask below is kept as a long-term FP-suppressor
      # for sky / distant trees / reflected surfaces.
      mask:
        # Sky / distant trees / reflected surfaces that trigger false motion
        - 0.623,0.08,0.605,0.109,0.602,0.175,0.633,0.181,0.668,0.186,0.678,0.157,0.678,0.109,0.655,0.081
        - 0.975,0.602,0.998,0.604,0.996,0.286,0.962,0.29,0.968,0.342,0.924,0.39,0.906,0.406,0.932,0.452,0.92,0.477,0.921,0.525,0.937,0.548,0.964,0.553
        - 0.704,0,0.766,0.103,0.799,0.102,0.872,0.082,0.904,0.055,0.877,0.005,0.857,0
    zones:
      prive:
        # Entry walkway + doorstep — immediate alert on entry
        coordinates:
          0,0.735,0,0.488,0.304,0.523,0.308,0,0.456,0,0.685,0,0.731,0.154,0.809,0.204,0.823,0.275,0.836,0.361,0.85,0.487,1,0.491,1,1,0.73,1,0.741,0.953,0.676,0.893,0.515,0.96,0.363,0.975,0.188,0.956,0.036,0.89,0.03,0.744
        loitering_time: 0
        inertia: 1
        objects: [person]
        filters:
          person:
            # min_area 300 (iter0) → 500 (deliberate 2026-06-05
            # tightening, kept 2026-07-31). At 1.7 m / 0° tilt the
            # doorbell sees a 20 m distant walker as a 27×88 px
            # bbox (≈2400 px²); the iter0 contract would also
            # catch motion-band noise in the 300-500 px² range
            # that triggers a review-class event. The 500 px²
            # in-zone floor suppresses those without affecting
            # close-range (3 m) detection.
            threshold: 0.55
            min_area: 500
            min_ratio: 1.0
            max_ratio: 4.0
    review:
      # Gate alerts to the prive zone (driveway + doorstep) so the
      # user is not pinged for non-property motion while armed_away.
      # passersby on the public sidewalk still produce detection-type
      # events (visible in the Frigate UI for review) but do not
      # generate the alert that the HA→iPhone notification chain
      # subscribes to.
      alerts:
        required_zones: [prive]
      detections:
        required_zones: []

