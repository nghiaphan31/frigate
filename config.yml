  #                (hwaccel_output_format cuda + crop,hwdownload,format=yuv420p)
  #                GPU crop — CPU never sees full 4096×1152 frame
  #   sub        = 1536×432  — live view only
  # ========================================================================
  jardin_devant_right:
    ffmpeg:
      hwaccel_args:
        - -hwaccel
        - cuda
        - -hwaccel_device
        - '0'
        - -hwaccel_output_format
        - cuda
      output_args:
        detect:
          - -vf
          - hwdownload,format=nv12,format=yuv420p,crop=2048:1152:2048:0
          - -f
          - rawvideo
          - -pix_fmt
          - yuv420p
      inputs:
        # main stream → detect with CUDA crop (right half 2048×1152)
        - path: rtsp://127.0.0.1:8554/jardin_devant_main
          roles: [detect]
        # main stream → record (4096×1152, shared with jardin_devant_left)
        - path: rtsp://127.0.0.1:8554/jardin_devant_main
          roles: [record]

    live:
      streams: {}  # Live view disabled — detection/recording/snapshots still active
                   # Half-crop cameras cause MSE rendering issues in the UI; the
                   # full panoramic (jardin_devant) is the primary live view.

    audio:
      enabled: false

    detect:
      # go2rtc crops right half of Duo 3 main → 2048×1152 (16:9)
      width: 2048
      height: 1152
      fps: 10
      max_disappeared: 100

    motion:
      threshold: 24
      contour_area: 40
      frame_alpha: 0.4
      delta_alpha: 0.5
      # TEMP iter1: motion masks removed for soak period to capture all pedestrian data.
      # Original masks covered 66.9% of frame (street + sky), blocking most detections.
      # Will be re-evaluated and re-added in iter2 based on false-positive analysis.

    objects:
      track: [person]
      filters:
        person:
          # iter2 (2026-05-25): p5/p95 from soak3 dump (152 events, 72h).
          # area p5=2296 p95=211100  ratio p5=0.16 p95=10.00
          # iter3 (2026-05-26): 26 events, 65% violations — mixed pattern:
          #   2 below_min_area (some very small persons below 2296px²)
          #   8 above_max_area → p95 observed 668k (3× above config max)
          #   1 below_min_ratio (very narrow), 6 above_max_ratio → p95 ratio=39.6
          #   Both area bounds and both ratio bounds need expansion.
          min_area: 1800           # iter3: was 2296, lowered slightly for tiny persons
          max_area: 750000         # iter3: was 211,100, raised to cover observed p95~668k
          min_ratio: 0.05          # iter3: was 0.16, lowered (very upright close persons)
          max_ratio: 40.0          # iter3: was 10.0, raised (overhead wide panoramic boxes)
          threshold: 0.57           # iter3: was 0.65, lowered (scores observed below 0.65)
          min_score: 0.52          # iter3: was 0.56, lowered

    snapshots:
      enabled: true

    zones:
      prive:
        coordinates:
          0,1,0,0.267,0.297,0.288,0.327,0.214,0.495,0.271,0.526,0.269,0.646,0.827,0.65,0.832,1,0.602,1,0.991,1,1
        loitering_time: 2
        inertia: 3
        objects: person
        filters:
          person:
            threshold: 0.57          # iter3: was 0.65
            min_area: 1800           # iter3: was 2296
            min_ratio: 0.05          # iter3: was 0.16
            max_ratio: 40.0          # iter3: was 10.0
      rodage:
        coordinates:
          0,0.255,0,0,0.229,0,0.359,0.058,0.379,0.103,0.497,0.153,0.508,0.241,0.54,0.239,0.667,0.819,0.65,0.837,0.529,0.283,0.523,0.273,0.501,0.273,0.337,0.214,0.3,0.287,0.182,0.28
        loitering_time: 10
        inertia: 3
        objects: person
        filters:
          person:
            threshold: 0.65
            min_area: 2296
            min_ratio: 0.16
            max_ratio: 10.0

    review:
      alerts:
        required_zones: prive
      detections:
