version: 0.17-0

# ----------------------------------------------------------------------------
# semantic_search — embedding-based event search (see ARCHITECTURE.md §4.14)
# ----------------------------------------------------------------------------
# enabled: turn the Jina CLIP v1 model on. Embeddings are computed for
#           every event's best frame + thumbnail, enabling
#           "find events that look like X" queries in the Frigate UI.
# reindex: false = don't recompute embeddings for existing events on
#           startup (saves time; the Jina model is downloaded once
#           and cached at trt-cache/jinaai/jina-clip-v1/, see
#           .gitignore). Set true once if the model changed.
# model_size: small = vision_model_quantized.onnx + text_model_fp16.onnx
#           (~84 MB total, runs on the same RTX 5060 Ti alongside
#           the object detector; ~50 ms per embedding).
# ----------------------------------------------------------------------------
semantic_search:
  enabled: true
  reindex: false
  model_size: small
