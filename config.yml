# ============================================================================
#                           FRIGATE NVR – FULL CONFIGURATION
# ============================================================================
#  Host:    Calypso (RTX 5060 Ti 16 GB GPU)
#  Date:    2026-05-21
#  Branch:  detection-optimisation
#
#  Purpose: Refactored, fully-annotated, self-contained Frigate configuration
#           * NO YAML anchors – everything is explicit and copy/paste ready
#           * Heavy inline comments explain WHY each value exists, not just WHAT
#           * Clear visual separators so you can jump to any section quickly
#
# -----------------------------------------------------------------------------
#  QUICK INDEX
#    1. GLOBAL SETTINGS
#         1.1  MQTT         – Home-Assistant event broker
#         1.2  FFMPEG       – CUDA hardware decoding + record profile
#         1.3  RECORD       – retention strategy
#         1.4  SNAPSHOTS    – still-image settings
#         1.5  OBJECTS      – default detection parameters
#         1.6  DETECTORS    – NVIDIA GPU via ONNX Runtime + TensorRT
#         1.7  MODEL        – Frigate+ custom trained model
#         1.8  MOTION       – global pre-filter (before ML)
#         1.9  AUDIO        – security-event audio analysis
#         1.10 GO2RTC       – restream from NUC go2rtc (192.168.50.112:8556)
#    2. CAMERAS
#         ├─ allee_sur_le_cote        Reolink Duo 3  – 192.168.50.129
#         │    ├─ allee_sur_le_cote_left   (left half)
#         │    └─ allee_sur_le_cote_right  (right half)
#         ├─ jardin_arriere           Reolink RLC-810A (single-lens) – 192.168.50.207
#         ├─ vue_entree               Reolink Doorbell POE – 192.168.50.222
#         ├─ jardin_devant            Reolink Duo 3  – 192.168.50.18
#         │    ├─ jardin_devant_left       (left half)
#         │    └─ jardin_devant_right      (right half)
#         └─ piscine_vue_toit         Reolink Duo 3  – 192.168.50.7
#              ├─ piscine_vue_toit_left    (left half)
#              └─ piscine_vue_toit_right   (right half)
#    3. ADVANCED FEATURES
#         3.1 SEMANTIC SEARCH
# ----------------------------------------------------------------------------
#
#  STREAM RESOLUTION REFERENCE
#  ─────────────────────────────────────────────────────────────────────────
#  Camera                  │ Main stream   │ Sub stream  │ Half-crop (go2rtc)
#  ────────────────────────┼───────────────┼─────────────┼───────────────────
#  Reolink Duo 3 (×3)      │ 4096×1152     │ 1536×432    │ 2048×1152 (L or R)
#  Reolink RLC-810A        │ 3840×2160 4K  │ 640×360     │ —
#  Reolink Doorbell POE    │ 2560×1920     │ 640×480     │ —
#  ─────────────────────────────────────────────────────────────────────────
#
#  DETECTION STREAM STRATEGY
#  ─────────────────────────────────────────────────────────────────────────
#  • Duo 3 whole-panoramic (4096×1152) is NOT used for detection — the 3.5:1
#    aspect ratio is incompatible with the mobilenet/SSD model input shape.
#    Instead, the NUC go2rtc crops each Duo 3 into two 2048×1152 halves.
#  • All cameras now use main-stream (or main half-crop) for detection to
#    maximise pixel density for the ML model.
#  • jardin_arriere (4K) is capped at 5 fps for detection — the model input
#    is 320×320 regardless, so 10 fps at 4K would waste GPU decode bandwidth.
#  ─────────────────────────────────────────────────────────────────────────
#
#  DETECTION PARAMETER STATUS (iter1 — wide-open temp params)
#  ─────────────────────────────────────────────────────────────────────────
#  Cameras migrated to main stream in iter1 use deliberately wide-open
#  min_area/max_area/min_ratio/max_ratio to allow unbiased event accumulation
#  during the 48-72h soak. These will be tightened in iter2 after the
#  Option-B API event dump analysis.
#  See: plans/detection-optimisation-plan.md
#  ─────────────────────────────────────────────────────────────────────────

# ============================================================================
# 1. GLOBAL SETTINGS – APPLY TO EVERY CAMERA UNLESS OVERRIDDEN
# ============================================================================

# ---------------------------------------------------------------------------
# 1.1 MQTT – CONNECTION TO HOME-ASSISTANT MOSQUITTO BROKER
# ---------------------------------------------------------------------------
mqtt:
  host: 192.168.50.125         # Mosquitto broker on Home Assistant
  user: mosquito
  password: mosquito
  topic_prefix: calypso_frigate
  client_id: frigate_calypso_client

# ---------------------------------------------------------------------------
# 1.2 FFMPEG – CUDA HARDWARE ACCELERATION & OUTPUT PROFILES
# ---------------------------------------------------------------------------
ffmpeg:
  # RTX 5060 Ti 16 GB — CUDA hardware decoding enabled.
  # -hwaccel_output_format cuda is intentionally omitted: keeping it would
  # leave decoded frames as CUDA surfaces in GPU memory, preventing Frigate
  # from extracting CPU-side pixel data for snapshots and detection.
  hwaccel_args:
    - -hwaccel
    - cuda
    - -hwaccel_device
    - '0'

  output_args:
    # preset-record-generic-audio-aac:
    #   • copies original video stream (no re-encode) — fast and lossless
    #   • transcodes audio to AAC — required by browsers that reject G.711/PCMU
    record: preset-record-generic-audio-aac

# ---------------------------------------------------------------------------
# 1.3 RECORD – VIDEO RETENTION POLICY
# ---------------------------------------------------------------------------
record:
  enabled: true
  continuous:
    days: 0                    # No continuous recording — motion-triggered only
  motion:
    days: 3                    # Keep motion-triggered clips for 3 days

# ---------------------------------------------------------------------------
# 1.4 SNAPSHOTS – STILL-IMAGE SETTINGS
# ---------------------------------------------------------------------------
snapshots:
  enabled: true
  timestamp: true              # Burn date & time onto the image
  bounding_box: true           # Draw bounding box around detected object
  clean_copy: true             # Also save an unannotated copy
  crop: false                  # Keep full frame (not cropped to bounding box)
  retain:
    default: 0                 # Discard non-person snapshots immediately
    objects:
      person: 7                # Keep person snapshots for 7 days

# ---------------------------------------------------------------------------
# 1.5 OBJECTS – DEFAULT DETECTION PARAMETERS (overridden per camera below)
# ---------------------------------------------------------------------------
objects:
  track:
    - person
  filters:
    person:
      min_area: 300            # Ignore tiny detections (insects, noise)
      min_score: 0.72          # Minimum per-frame confidence to consider
      threshold: 0.72          # Sustained confidence required to trigger event
      max_area: 100000         # Discard oversized blobs (e.g. frozen/corrupt frames)

# ---------------------------------------------------------------------------
# 1.6 DETECT – GLOBAL ENABLE (required; Frigate 0.17.1 defaults to false)
# ---------------------------------------------------------------------------
detect:
  enabled: true                # Must be explicitly true — Frigate default is false

# ---------------------------------------------------------------------------
# 1.7 DETECTORS – RTX 5060 Ti 16 GB via ONNX Runtime + TensorRT
# ---------------------------------------------------------------------------
detectors:
  onnx1:
    type: onnx                 # NVIDIA GPU inference via ONNX Runtime + TensorRT
    device: "0"                # First GPU (quoted string required by Frigate schema)

# ---------------------------------------------------------------------------
# 1.7 MODEL – Frigate+ custom trained model
# ---------------------------------------------------------------------------
# This plus:// model was trained on snapshots from these cameras.
# It improves detection accuracy for the specific angles, lighting, and
# environments of this installation compared to the default mobilenet model.
model:
  path: plus://6ea1f38db36e21f44a1eb1071d9958ed

# ---------------------------------------------------------------------------
# 1.8 MOTION – GLOBAL PRE-FILTER (runs before ML inference)
# ---------------------------------------------------------------------------
motion:
  threshold: 26                # Higher = less sensitive. 26 catches light changes
                               # while filtering most micro-movements (leaves, noise).
  contour_area: 30             # Minimum blob size to consider as motion (px²).
                               # Rejects isolated leaves and sensor noise.
  frame_alpha: 0.4             # Temporal smoothing — avoids reacting to single-frame spikes
  delta_alpha: 0.5
  improve_contrast: true       # Helps night/IR detection without penalising daytime

# ---------------------------------------------------------------------------
# 1.9 AUDIO – SECURITY-EVENT ANALYSIS
# ---------------------------------------------------------------------------
audio:
  enabled: true
  # min_volume thresholds:
  #   ~200  very sensitive (quiet indoor)
  #   ~350  typical outdoor background
  #   ~700+ noisy street-facing camera
  min_volume: 350

  # listen: is commented out — Frigate will log all recognised audio labels.
  # Once you confirm which labels appear, uncomment and restrict to:
  #   glass_breaking, gunshot_gunfire, explosion, scream, yell,
  #   smoke_alarm, fire_alarm, carbon_monoxide_alarm, car_alarm, siren

# ---------------------------------------------------------------------------
# 1.10 GO2RTC – RESTREAM FROM NUC go2rtc (192.168.50.112:8556)
# ---------------------------------------------------------------------------
# Frigate's internal go2rtc instance powers the web UI live view.
# Each stream key here must match the camera name in the cameras: section.
#
# Stream naming convention from NUC go2rtc:
#   reolink_duo_<name>_main        → full 4096×1152 panoramic (Duo 3)
#   reolink_duo_<name>_sub         → full 1536×432 sub-stream (Duo 3)
#   reolink_duo_<name>_main_left   → left 2048×1152 crop of main (Duo 3)
#   reolink_duo_<name>_main_right  → right 2048×1152 crop of main (Duo 3)
#   reolink_<name>_main            → single-lens main stream
#   reolink_<name>_sub             → single-lens sub-stream
# ---------------------------------------------------------------------------
go2rtc:
  webrtc:
    # WebRTC achieves sub-200ms latency vs MSE.
    # Port 8555 must be reachable on the Calypso machine.
    candidates:
      - 192.168.50.150:8555
      - stun:8555

  streams:
    # ── Allée sur le côté — Reolink Duo 3 (192.168.50.129) ──────────────────
    # Physical sensor: dual-lens panoramic
    # Main stream:  4096×1152  (full panoramic, used for recording)
    # Sub stream:   1536×432   (full panoramic, used for live view)
    # Half-crops:   2048×1152  each (produced by NUC go2rtc, used for detection)
    allee_sur_le_cote_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main
    allee_sur_le_cote_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_sub
    allee_sur_le_cote_left:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main_left
    allee_sur_le_cote_right:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main_right

    # ── Jardin arrière — Reolink RLC-810A single-lens (192.168.50.207) ──────
    # Physical sensor: single-lens, fixed mount, north-facing
    # Main stream:  3840×2160  (4K UHD, used for detection + recording)
    # Sub stream:   640×360    (used for live view only)
    jardin_arriere_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_nord_sur_maison_main
    jardin_arriere_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_nord_sur_maison_sub

    # ── Vue entrée — Reolink Doorbell POE (192.168.50.222) ──────────────────
    # Physical sensor: single-lens doorbell, downward-angled
    # Main stream:  2560×1920  (4:3 aspect, used for detection + recording)
    # Sub stream:   640×480    (4:3 aspect, used for live view only)
    vue_entree_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_entree_main
    vue_entree_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_entree_sub

    # ── Jardin devant — Reolink Duo 3 (192.168.50.18) ───────────────────────
    # Physical sensor: dual-lens panoramic, street-facing
    # Main stream:  4096×1152  (full panoramic, used for recording)
    # Sub stream:   1536×432   (full panoramic, used for live view)
    # Half-crops:   2048×1152  each (produced by NUC go2rtc, used for detection)
    jardin_devant_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_main
    jardin_devant_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_sub
    jardin_devant_main_left:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_main_left
    jardin_devant_main_right:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_main_right

    # ── Piscine vue toit — Reolink Duo 3 (192.168.50.7) ────────────────────
    # Physical sensor: dual-lens panoramic, rooftop mount, south-facing
    # Main stream:  4096×1152  (full panoramic, used for recording)
    # Sub stream:   1536×432   (full panoramic, used for live view)
    # Half-crops:   2048×1152  each (produced by NUC go2rtc, used for detection)
    piscine_vue_toit_main:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_vue_sud_main
    piscine_vue_toit_sub:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_vue_sud_sub
    piscine_vue_toit_left:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_vue_sud_main_left
    piscine_vue_toit_right:
      - rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_vue_sud_main_right

# ============================================================================
# 2. CAMERA DEFINITIONS
# ============================================================================

cameras:

  # ==========================================================================
  # CAMERA: ALLEE_SUR_LE_COTE
  # Hardware:  Reolink Duo 3 Wi-Fi/ETH — 192.168.50.129
  # Position:  Driveway side view, eye-level, covers gate + approach
  # Streams:
  #   detect  → sub 1536×432   (full panoramic sub-stream)
  #             NOTE: full panoramic used here for zone coverage across the
  #             entire driveway width. Left/right split cameras handle
  #             high-res detection for each half.
  #   record  → main 4096×1152 (full panoramic, lossless copy)
  #   audio   → main (mic channel embedded in main stream)
  #   live    → sub 1536×432   (lightweight for UI grid)
  # ==========================================================================
  allee_sur_le_cote:

    ffmpeg:
      inputs:
        - path:
            rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_sub
          roles: [detect]
        - path:
            rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main
          roles: [record, audio]

    live:
      streams:
        Allée côté (panoramique): allee_sur_le_cote_sub

    audio:
      enabled: true

    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false

    detect:
      # Sub-stream: 1536×432 (full panoramic, 3.56:1 aspect ratio)
      # Pixel density: 663,552 px total
      width: 1536
      height: 432
      fps: 5

    objects:
      track: [person]
      filters:
        person:
          min_area: 4000         # Far-end person ≈ 50×80 = 4000 px²
          max_area: 40000        # Close person ≈ 80×200 = 16000 px² (iter0-fix: was 12000)
          min_ratio: 0.20        # Standing person: width/height ≈ 0.25–0.45
          max_ratio: 3.5         # Reject extreme horizontal blobs (poles, artefacts)
          threshold: 0.65

    snapshots:
      enabled: true

    zones:
      prive:
        # Private driveway — immediate alert on entry
        coordinates:
          0.276,1,0,1,0,0.539,0.064,0.645,0.104,0.361,0.102,0.329,0.092,0.31,0.131,0.248,0.225,0.112,0.323,0,0.478,0,0.65,0,0.693,0.053,0.762,0.129,0.827,0.22,0.887,0.323,0.908,0.362,0.925,0.332,0.95,0.331,0.963,0.395,0.972,0.439,0.989,0.588,1,0.573,0.999,0.996
        loitering_time: 0
        inertia: 3
        objects: [person]
        filters:
          person:
            threshold: 0.55
            min_area: 4000
            min_ratio: 0.15
            max_ratio: 4.0

      rodage:
        # Fence line — alert only after 10s loitering
        coordinates: 0.075,0.473,0.094,0.335,0.101,0.343,0.064,0.623,0.056,0.612
        loitering_time: 10
        inertia: 3
        objects: [person]
        filters:
          person:
            threshold: 0.62
            min_area: 4000
            min_ratio: 0.20
            max_ratio: 3.8

    review:
      alerts:
        required_zones: prive
      detections:
        required_zones: rodage

  # ==========================================================================
  # CAMERA: ALLEE_SUR_LE_COTE_LEFT
  # Hardware:  Reolink Duo 3 — left lens half (same physical camera as above)
  # Position:  Left half of driveway — covers gate and street approach
  # Streams:
  #   detect  → main_left 2048×1152  (left half-crop of 4096×1152 main)
  #             iter1: migrated from sub_left 768×432 → 7× more pixels
  #   record  → main 4096×1152 (shared connection, Frigate deduplicates)
  #   audio   → main (shared)
  #   live    → sub 1536×432 (full panoramic sub for UI context)
  # ==========================================================================
  allee_sur_le_cote_left:

    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main_left
          roles: [detect]
        - path: rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main
          roles: [record, audio]

    live:
      streams:
        Allée côté gauche: allee_sur_le_cote_left

    audio:
      enabled: true

    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false

    detect:
      # main_left half-crop: 2048×1152 (16:9, left half of Duo 3 main)
      # Pixel density: 2,359,296 px total — 7× more than sub_left (768×432)
      width: 2048
      height: 1152
      fps: 10

    objects:
      track: [person]
      filters:
        person:
          # TEMP iter1: wide-open for 48-72h data collection on new main stream.
          # Will be tightened in iter2 after Option-B event dump analysis.
          min_area: 500
          max_area: 2000000
          min_ratio: 0.05
          max_ratio: 20.0
          threshold: 0.60
          min_score: 0.45

    snapshots:
      enabled: true

    zones:
      prive:
        coordinates:
          1,1,1,0.002,0.703,0.002,0.506,0.112,0.496,0.124,0.486,0.12,0.464,0.138,0.322,0.239,0.254,0.296,0.244,0.32,0.234,0.329,0.226,0.336,0.247,0.363,0.155,0.694,0,0.568,0,1
        loitering_time: 0
        inertia: 3
        objects: [person]
        filters:
          person:
            threshold: 0.55
            min_area: 1000
            min_ratio: 0.15
            max_ratio: 4.0
      rodage:
        coordinates: 0.231,0.382,0.198,0.348,0.111,0.635,0.151,0.665
        loitering_time: 10
        inertia: 3
        objects: [person]
        filters:
          person:
            threshold: 0.62
            min_area: 2000
            min_ratio: 0.20
            max_ratio: 3.8

    review:
      alerts:
        required_zones: prive
      detections:
        required_zones: rodage

    motion:
      mask:
        0.587,0.002,0,0,0,0.533,0.107,0.629,0.194,0.345,0.199,0.315,0.207,0.292,0.308,0.2,0.398,0.127,0.41,0.117,0.422,0.097

  # ==========================================================================
  # CAMERA: ALLEE_SUR_LE_COTE_RIGHT
  # Hardware:  Reolink Duo 3 — right lens half (same physical camera as above)
  # Position:  Right half of driveway — covers garden side and rear approach
  # Streams:
  #   detect  → main_right 2048×1152  (right half-crop of 4096×1152 main)
  #             iter1: migrated from sub_right 768×432 → 7× more pixels
  #   record  → main 4096×1152 (shared connection, no second audio needed)
  #   live    → sub 1536×432 (full panoramic sub for UI context)
  # ==========================================================================
  allee_sur_le_cote_right:

    ffmpeg:
      inputs:
        - path: rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main_right
          roles: [detect]
        - path: rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_allee_cote_main
          roles: [record]

    live:
      streams:
        Allée côté droite: allee_sur_le_cote_right

    audio:
      enabled: false             # Audio already captured by allee_sur_le_cote_left

    mqtt:
      enabled: true
      timestamp: true
      bounding_box: true
      crop: false

    detect:
      # main_right half-crop: 2048×1152 (16:9, right half of Duo 3 main)
      # Pixel density: 2,359,296 px total — 7× more than sub_right (768×432)
      width: 2048
      height: 1152
      fps: 10

    objects:
      track: [person]
      filters:
        person:
          # TEMP iter1: wide-open for 48-72h data collection on new main stream.
          # Will be tightened in iter2 after Option-B event dump analysis.
          min_area: 500
          max_area: 2000000
          min_ratio: 0.05
          max_ratio: 20.0
          threshold: 0.60
          min_score: 0.45

    snapshots:
      enabled: true

    zones:
      prive:
        coordinates:
          1,1,0,1,0,0,0.299,0,0.498,0.097,0.63,0.177,0.748,0.274,0.823,0.349,0.849,0.338,0.877,0.322,0.907,0.299,0.926,0.288,0.939,0.327,0.946,0.359,0.951,0.393,0.975,0.376,1,0.521,1,0.582,1,0.605
        loitering_time: 0
        inertia: 3
        objects: [person]
        filters:
          person:
            threshold: 0.55
            min_area: 1000
            min_ratio: 0.15
            max_ratio: 4.0

    review:
      alerts:
        required_zones: prive

    motion:
      mask:
        - 0.464,0.011,0.499,0,0.587,0,1,0.004,1,0.51,0.971,0.301,0.948,0.188,0.952,0.104,0.913,0.027,0.765,0.028,0.83,0.173,0.85,0.223,0.868,0.258,0.832,0.294,0.694,0.17,0.665,0.145,0.623,0.113
        - 0.932,0.116,0.971,0.064,0.984,0.183,0.999,0.204,0.998,0.469,0.989,0.469,0.979,0.394,0.965,0.247

  # ==========================================================================
  # CAMERA: JARDIN_ARRIERE
  # Hardware:  Reolink RLC-810A single-lens — 192.168.50.207
  # Position:  North-facing, covers rear garden, play area, and shed
  # Streams:
  #   detect  → main 3840×2160  (4K UHD)
  #             iter1: migrated from sub 640×360 → 36× more pixels
  #             fps=5: 4K at 10fps wastes GPU decode; model input is 320×320
  #   record  → main 3840×2160 (same connection, Frigate deduplicates)
  #   audio   → main (mic channel embedded)
  #   live    → sub 640×360 (lightweight for UI grid)
  # ==========================================================================
  jardin_arriere:

    ffmpeg:
      inputs:
        - path:
            rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_nord_sur_maison_main
          roles: [detect]
        - path:
            rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_vue_nord_sur_maison_main
          roles: [record, audio]

    live:
      streams:
        Jardin arrière: jardin_arriere_sub

    audio:
      enabled: true

    detect:
      # Main stream: 3840×2160 (4K UHD, 16:9)
      # Pixel density: 8,294,400 px total
      # fps=5: Frigate model input is 320×320 regardless of source resolution;
      # 4K at 10fps would double GPU decode load with no detection benefit.
