  jardin_devant_left:
    # ---------------------------- STREAM INPUTS -----------------------------
    ffmpeg:
      # Tip: if VA-API crashes on detect for Duo 3, uncomment to force software decode ONLY for this cam:
      # hwaccel_args: []
      inputs:
        # Low-res substream → detection (lighter, faster)
        - path: 
            rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_main_left
          roles: [detect]
        # High-res main stream → recording (and audio if present)
        - path: 
            rtsp://go2rtc:go2rtc@192.168.50.112:8556/reolink_duo_jardin_devant_main
          roles: [record]

    # --------------------------- AUDIO (RECORD) -----------------------------
    audio:
      enabled: false            # Keep mic channel in recordings (useful for later analytics/rules)

    # --------------------------- DETECTION CORE -----------------------------
    detect:
      width: 2048              # Match substream width (ultra-wide)
      height: 1152              # Match substream height
      fps: 5                   # Balanced: enough chances to catch a good pose, still light on CPU
      max_disappeared: 40   # ≈ 10 s à 5 fps (50 frames sans détection avant de “perdre” l’objet)


    # ---------------------------- MOTION GATING -----------------------------
    # Caméra "Jardin Devant Left"
    # Personnes de taille moyenne, assez loin mais bien visibles.
    motion:
      # Mouvement : filtrer les petites variations (feuilles, reflets légers)
      contour_area: 100      # aire mini d'un blob de mouvement (~1 % du frame)
      threshold: 25           # plus haut = moins sensible
      delta_alpha: 0.2        # lissage entre deux frames (0.2 = bon compromis)
      mask:
        - 0,0.504,0,0,0.015,0,0.999,0,0.99,0.016,0.556,0.067,0.511,0.165,0.394,0.775,0.199,0.651
        - 0.593,0.091,0.899,0.048,0.926,0.156,0.899,0.273,0.644,0.286,0.553,0.142,0.568,0.107
      improve_contrast: true
    objects:
      track:
        - person
      filters:
        person:
          min_area: 13000        # un peu en-dessous de 900 pour ne pas rater des poses petites
          max_area: 52000

          # Forme humaine, mais pas trop restrictive vu la vue plongeante
          min_ratio: 0.15
          max_ratio: 3.0

          # Confiance : plus souple que ce qu’on avait mis
          threshold: 0.8      # était 0.35
          min_score: 0.80      # était 0.30
      mask: 
        0.002,0,1,0,1,0.026,0.768,0.04,0.568,0.085,0.546,0.129,0.511,0.276,0.484,0.425,0.444,0.649,0.412,0.811,0,0.556
    # ------------------------------ SNAPSHOTS -------------------------------
    snapshots:
      enabled: true            # Standard snapshot behaviour (uses main stream quality if configured globally)

    # --------------------------- ZONES & BEHAVIOUR --------------------------
    zones:

      # ---- 'prive' — Inside the fence (your private area) ------------------
      # More permissive: person may be partially seen (bust/edge/occluded).
      prive:
        coordinates: 0,1,1,1,1,0.285,0.65,0.296,0.576,0.204,0.47,0.865,0,0.561
        loitering_time: 0      # Immediate alert when a person enters
        inertia: 3             # Keep event open for 3 s after exit (avoid flicker)
        objects: person
        filters:
          person:
            # Encore plus permissif à l’intérieur de ta propriété
            threshold: 0.8      # en dessous du global 0.30
            min_area: 13000        # plus petit que global
            min_ratio: 0.25      # très vertical autorisé
            max_ratio: 5


      # ---- 'rodage' — Sidewalk/approach band (outside fence) ---------------
      # Stricter behaviour: only alert if someone lingers (loiters) here.
      rodage:
        coordinates: 
          1,0.034,0.998,0.28,0.65,0.297,0.575,0.191,0.469,0.858,0.416,0.821,0.539,0.136,0.582,0.092,0.793,0.046
        loitering_time: 10     # Require ≥10 s inside before raising event
        inertia: 3             # Debounce exit
        objects: person
        filters:
          person:
            # Plus strict que 'prive' pour éviter de spammer sur le trottoir
            threshold: 0.8      # un cran au-dessus de 'prive'
            min_area: 13000        # un peu plus grand
            min_ratio: 0.10
            max_ratio: 5.0

    # ----------------------------- REVIEW RULES -----------------------------
    # These are your policy rules for what gets alerted vs merely recorded.
    review:
      alerts:
        required_zones: prive   # Push notifications only if the event entered 'prive'
      detections:
        required_zones: rodage  # Keep events when someone loiters at 'rodage'

