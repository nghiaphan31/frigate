
# =============================================================================
# SoT v5 — Universal Source of Truth with Groups (YAML)
# -----------------------------------------------------------------------------
# PURPOSE
# - Extend SoT v4 (human-semantic, multi-protocol) with "groups" of devices.
# - A group aggregates devices and/or sub-groups with the same human-first logic.
#
# CORE LOGIC
# - Canonical human name (`alias_human`) → slugified `hostname` (lowercase, a–z, 0–9, -).
# - FQDN: <hostname>.<category>.<zone_root>  (same rule for devices AND groups).
# - `category` for groups uses the prefix `group.` (e.g., group.light, group.sensor, group.camera, group.zone).
# - `members` holds device references by `sot_id`; `includes` nests other groups (hierarchy).
# - Keep double-layer separation:
#     * Semantic: alias_human, description, location, nlu (synonyms/intents)
#     * Technical: hostname, fqdn, sot_id / group_id, integrations, provenance
# - Location is hierarchical (home/floor/zone/area) to enable natural queries (“éteins toutes les lights à l’extérieur”).
# - Interop: categories align with Home Assistant domains; groups can map to HA groups/entities.
#
# NAMING POLICY
# - Human-first: alias_human is the single source of meaning (spoken name).
# - Hostname is the slug of alias_human; do not repeat the role already conveyed by `category`.
# - Example: alias_human "Lumières Terrasse" → hostname "lumieres-terrasse" →
#            fqdn "lumieres-terrasse.group.light.home.arpa".
#
# =============================================================================

meta:
  schema_version: 5.0
  zone_root: "home.arpa"
  naming_policy: "human_semantic_v1"
  last_updated: "YYYY-MM-DDThh:mm:ssZ"
  notes: >
    SoT v5 adds hierarchical groups on top of SoT v4. A group is a first-class
    entity with a human alias, a slug hostname, and a typed category (group.*).
    It references devices by sot_id and can include other groups. This structure
    is designed to interoperate with Home Assistant, LLMs, and voice assistants.

devices:
  # ---------------------------------------------------------------------------
  # EXAMPLE DEVICES (short extract)
  # ---------------------------------------------------------------------------
  - sot_id: "sot-ZB-LIGHT-TER1"
    alias_human: "Lampe Terrasse"
    hostname: "lampe-terrasse"
    category: "light"
    fqdn: "lampe-terrasse.light.home.arpa"
    description: "Ampoule extérieure terrasse"
    location: { home: "maison", floor: 0, zone: "exterieur", area: "terrasse" }
    interfaces:
      - transport: "zigbee"
        ieee: "0x00158D00045F0000"
        bridge: "z2m"
    manufacturer: "IKEA"
    model: "TRÅDFRI Bulb E27"
    owner: "nghia"
    status: "online"
    integrations:
      homeassistant: "light.terrasse"

  - sot_id: "sot-ZB-LIGHT-TER2"
    alias_human: "Applique Terrasse"
    hostname: "applique-terrasse"
    category: "light"
    fqdn: "applique-terrasse.light.home.arpa"
    description: "Applique murale extérieure"
    location: { home: "maison", floor: 0, zone: "exterieur", area: "terrasse" }
    interfaces:
      - transport: "zigbee"
        ieee: "0x00158D00045F0001"
        bridge: "z2m"
    manufacturer: "Philips"
    model: "Hue Outdoor"
    owner: "nghia"
    status: "online"
    integrations:
      homeassistant: "light.applique_terrasse"

groups:
  # ---------------------------------------------------------------------------
  # TEMPLATE GROUP (copy/paste)
  # ---------------------------------------------------------------------------
  - group_id: "sot-group-XXXXXXXX"
    alias_human: "Nom du groupe"
    hostname: "nom-groupe-slug"
    category: "group.light"              # group.light / group.sensor / group.camera / group.zone / group.media / etc.
    fqdn: "nom-groupe-slug.group.light.home.arpa"
    description: "Regroupe plusieurs entités d'une même catégorie"
    location:
      home: "maison"                      # optional
      floor: 0                            # optional
      zone: "exterieur"                   # optional
      area: "terrasse"                    # optional
    members:                              # device references by sot_id
      - "sot-ZB-LIGHT-TER1"
      - "sot-ZB-LIGHT-TER2"
    includes: []                          # sub-group references by group_id
    nlu:
      synonyms: ["Alias vocal alternatif"]
      intents: ["allumer", "eteindre", "dimmer"]
    integrations:
      homeassistant: "light.terrasse_group"
    owner: "nghia"
    status: "online"
    capabilities: ["on_off", "brightness"]
    threat_level: "low"
    provenance: "manual_definition"

  # ---------------------------------------------------------------------------
  # EXAMPLE — higher-level zone group (aggregates sub-groups)
  # ---------------------------------------------------------------------------
  - group_id: "sot-group-ZONE-EXTER"
    alias_human: "Éclairage Extérieur"
    hostname: "eclairage-exterieur"
    category: "group.light"
    fqdn: "eclairage-exterieur.group.light.home.arpa"
    description: "Toutes les lumières extérieures de la maison"
    location: { home: "maison", zone: "exterieur" }
    members: []                           # no direct devices
    includes: ["sot-group-XXXXXXXX"]      # includes the Terrasse group above
    nlu:
      synonyms: ["Lumières Extérieures", "Éclairage Jardin"]
      intents: ["allumer", "eteindre"]
    integrations:
      homeassistant: "light.exterieur_group"
    owner: "nghia"
    status: "online"
    provenance: "manual_definition"
