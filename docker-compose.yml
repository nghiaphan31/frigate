networks:
  cctv_net: {}          # isolated network for Ring traffic & RTSP proxy

services:
# ───────────────────────────── ring-mqtt ─────────────────────────────
  ring-mqtt:
    image: tsightler/ring-mqtt:latest
    container_name: ring-mqtt
    restart: unless-stopped
    networks:
      - default              # keep existing (optional)
      - cctv_net             # ← NEW: same as go2rtc
    ports:
      - "8558:8554"        # host 8558 → container 8554 (debug only)
      - "55123:55123"      # token-helper Web UI
    environment:
      MQTT_URL: mqtt://mosquito:mosquito@192.168.1.24:1883
      LIVESTREAM_USER: go2rtc           # **must match go2rtc.yaml**
      LIVESTREAM_PASS: go2rtc
    volumes:
      - ./ring-mqtt/data:/data           # contains config.json & tokens
      - /etc/localtime:/etc/localtime:ro

# ───────────────────────────── go2rtc proxy ──────────────────────────
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    networks: { cctv_net: {} }           # can reach “ring-mqtt:8554”
    ports:
      - "8556:8554"        # host 8556 → container 8554 (RTSP out)
      - "1985:1984"        # host 1985 → container 1984 (Web/API)
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
      - /etc/localtime:/etc/localtime:ro

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
    - 8080:8080
    restart: unless-stopped
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable   # or :0.13.2 when pinned
    container_name: frigate
    restart: unless-stopped
    privileged: false               # no USB Coral here; set true if you add one
    network_mode: host              # makes 192.168.1.36:8556 reachable without extra ports
    shm_size: "512m"                # FFmpeg needs some shared-mem for six 1080p feeds
    environment:
      TZ: Europe/Paris
    volumes:
      - ./frigate/config.yml:/config/config.yml:ro       # put the file from step 2 here
      - ./frigate/storage:/media/frigate                 # recordings / snapshots
      - type: tmpfs                                      # avoids SSD wear
        target: /tmp/ramdisk
        tmpfs:
          size: 256000000
    devices:                                             # VA-API hardware decode
      - /dev/dri/renderD128:/dev/dri/renderD128
    depends_on:
      - go2rtc                                           # wait for the proxy

  grafana:
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    image: grafana/grafana-oss:latest
    ports:
    - 3000:3000
    restart: unless-stopped
    volumes:
    - grafana_data:/var/lib/grafana
  node-exporter:
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/rootfs
    - --collector.filesystem.ignored-mount-points
    - ^/(sys|proc|dev|host|etc)($|/)
    container_name: node-exporter
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
  prometheus:
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
    - 9090:9090
    restart: unless-stopped
    volumes:
    - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - prometheus_data:/prometheus

volumes:
  grafana_data: {}
  prometheus_data: {}      