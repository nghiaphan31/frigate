# -------------------------------------------------------------------------
# docker-compose.yml (annotated)
# -------------------------------------------------------------------------
# This compose file launches:
#   • ring-mqtt  – talks to Ring's cloud, publishes MQTT entities, and exposes an RTSP
#                 server (via its own embedded go2rtc) inside the container on :8554.
#   • go2rtc     – stand‑alone proxy that pulls the RTSP streams from ring-mqtt and re‑publishes
#                 them on host port 8556 (plus a Web/UI on 1985).
#   • frigate    – NVR/Detection engine that consumes the proxy streams.
#   • cadvisor / prometheus / grafana / node‑exporter – optional monitoring stack.
#
#  All Ring‑related traffic is isolated in the custom `cctv_net` user‑defined bridge
#  so it never touches the default bridge network.
#
#  Time‑zone is set to Europe/Paris for consistent logs.
# -------------------------------------------------------------------------

networks:
  cctv_net: {}          # user‑defined bridge dedicated to CCTV workload

services:
# ───────────────────────────── ring‑mqtt ─────────────────────────────
  ring-mqtt:
    image: tsightler/ring-mqtt:latest
    container_name: ring-mqtt
    restart: unless-stopped       # auto‑recreate unless you stop it manually
    networks:
      - default                  # allow Home Assistant to auto‑discover over default bridge
      - cctv_net                 # allow go2rtc on the same bridge to reach :8554
    ports:
      - "8558:8554"              # OPTIONAL debug expose of RTSP direct from ring‑mqtt
      - "55123:55123"            # Token-helper Web UI (only needed on first login)
    environment:
      # MQTT broker URL the addon will publish all Ring topics to
      MQTT_URL: mqtt://mosquito:mosquito@192.168.50.125:1883
      # Credentials must match go2rtc.yaml so the proxy can subscribe
      LIVESTREAM_USER: go2rtc
      LIVESTREAM_PASS: go2rtc
    volumes:
      - ./ring-mqtt/data:/data            # holds config.json, Ring token & runtime state
      - /etc/localtime:/etc/localtime:ro  # keep logs in host timezone
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8554"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ───────────────────────────── go2rtc proxy ──────────────────────────
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    networks:
      cctv_net: {}                       # same isolated network as ring‑mqtt
    ports:
      - "8556:8554"        # RTSP out to LAN :8556  →  container :8554
      - "1985:1984"        # Web/UI out to LAN  :1985 →  container :1984
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro   # proxy mapping rules
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1984/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      ring-mqtt:
        condition: service_healthy

# ───────────────────────────── Frigate NVR ───────────────────────────
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    network_mode: host          # simplest way to reach go2rtc on 192.168.50.112:8556
    shm_size: "512m"            # shared‑mem for FFmpeg decode pipelines
    environment:
      TZ: Europe/Paris
      LIBVA_DRIVER_NAME: iHD         # Ensures use of Intel iGPU VA-API driver
      FRIGATE_HWACCEL: vaapi         # (Optional, for explicit Frigate config)
    privileged: false           # set true if you add a USB Coral
    volumes:
      - ./frigate/config.yml:/config/config.yml
      #- ./frigate/storage:/media/frigate        # where clips & recordings land
      - /mnt/nas/video/frigate:/media/frigate # where clips & recordings land
      # tmpfs keeps frequent temp files off your SSD
      - type: tmpfs
        target: /tmp/ramdisk
        tmpfs:
          size: 256000000
    devices:
      - /dev/dri:/dev/dri            # Map entire /dev/dri for all VA-API nodes
    depends_on:
      go2rtc:
        condition: service_healthy

  restic-backup:
    image: ghcr.io/lobaro/restic-backup-docker:latest
    container_name: restic-backup
    hostname: restic
    restart: unless-stopped

    env_file:
      - ./restic/restic.env
    environment:
      # Use Synology share path (SFTP chroot): backups/nuc
      RESTIC_REPOSITORY: sftp:nuc_backup@192.168.50.232:/backups/nuc

      # What to back up (inside the container). These paths come from volumes below.
      RESTIC_BACKUP_SOURCES: "/host_etc /host_root /host_home /stack_repo /srv/docker-vols /docker_vols"
      # Keep things lean:
      RESTIC_BACKUP_ARGS: >
        --exclude '/host_home/*/.cache'
        --exclude '/host_root/.cache'
        --exclude '/stack_repo/**/.git'
        --exclude '/srv/docker-vols/**/cache'
        --exclude '/srv/docker-vols/**/tmp'
        --exclude '/docker_vols/*/_data/tmp'
        --exclude '/docker_vols/*/_data/cache'
        # Optional: Frigate recordings can be massive; uncomment to skip
        --exclude '/host_home/nghia-phan/git/nuc-docker-stack/frigate/storage/**'


      # Schedule + retention
      BACKUP_CRON: "0 3 * * *"
      RESTIC_FORGET_ARGS: "--keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune"

    volumes:
      # Mount our key as /root/.ssh/id_ed25519 
      - ./restic/ssh:/root/.ssh:rw
      # Pass restic.env into the container at a stable path
      - ./restic/restic.env:/host/restic.env:ro

      # Host data to protect (adjust to your setup)
      - /etc:/host_etc:ro
      - /root:/host_root:ro
      - /home:/host_home:ro
      - /home/nghia-phan/git/nuc-docker-stack:/stack_repo:ro
      - /srv/docker-vols:/srv/docker-vols:ro
      - /var/lib/docker/volumes:/docker_vols:ro

      # (Optional) include named Docker volumes (crash-consistent unless you dump DBs)
      - /var/lib/docker/volumes:/docker_vols:ro

    labels:
      - "com.centurylinklabs.watchtower.enable=false"

# ───────────────────────────── Monitoring stack (optional) ───────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"           # browse container metrics
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --collector.filesystem.ignored-mount-points
      - ^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  grafana_data: {}
  prometheus_data: {}
