version: "3.8"
services:
  ingest-media-01:
    image: python:3.11-slim
    container_name: ingest-media-01
    restart: unless-stopped
    ulimits:
      nofile: { soft: 8192, hard: 16384 }
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }
    volumes:
      - /volume1:/mnt/nas
      - /volume1/run/nas-pipelines:/work
      - type: tmpfs
        target: /tmp
        tmpfs: { size: 134217728 }
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: ["/bin/bash","-lc","/work/tools/run_ingest.sh"]
