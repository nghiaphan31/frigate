name: nuc-docker-stack
services:
  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /var/run
        target: /var/run
        bind:
          create_host_path: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /var/lib/docker/
        target: /var/lib/docker
        read_only: true
        bind:
          create_host_path: true
  frigate:
    container_name: frigate
    depends_on:
      go2rtc:
        condition: service_healthy
        required: true
    devices:
      - source: /dev/dri
        target: /dev/dri
        permissions: rwm
    environment:
      FRIGATE_HWACCEL: vaapi
      LIBVA_DRIVER_NAME: iHD
      TZ: Europe/Paris
    image: ghcr.io/blakeblackshear/frigate:stable
    network_mode: host
    restart: unless-stopped
    shm_size: "536870912"
    volumes:
      - type: bind
        source: /home/nghia-phan/git/nuc-docker-stack/frigate/config.yml
        target: /config/config.yml
        bind:
          create_host_path: true
      - type: bind
        source: /mnt/nas/video/frigate
        target: /media/frigate
        bind:
          create_host_path: true
      - type: tmpfs
        target: /tmp/ramdisk
        tmpfs:
          size: "256000000"
  go2rtc:
    container_name: go2rtc
    depends_on:
      ring-mqtt:
        condition: service_healthy
        required: true
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:1984/ || exit 1
      timeout: 3s
      interval: 10s
      retries: 5
      start_period: 5s
    image: ghcr.io/alexxit/go2rtc:latest
    networks:
      cctv_net: {}
    ports:
      - mode: ingress
        target: 8554
        published: "8556"
        protocol: tcp
      - mode: ingress
        target: 1984
        published: "1985"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/nghia-phan/git/nuc-docker-stack/go2rtc/go2rtc.yaml
        target: /config/go2rtc.yaml
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: true
  grafana:
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    image: grafana/grafana-oss:latest
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: grafana_data
        target: /var/lib/grafana
        volume: {}
  node-exporter:
    command:
      - --collector.filesystem.ignored-mount-points
      - ^/(sys|proc|dev|host|etc)($$|/)
    container_name: node-exporter
    image: prom/node-exporter:latest
    network_mode: host
    pid: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind:
          create_host_path: true
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    container_name: prometheus
    image: prom/prometheus:latest
    networks:
      default: null
    ports:
      - mode: ingress
        target: 9090
        published: "9090"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/nghia-phan/git/nuc-docker-stack/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        bind:
          create_host_path: true
      - type: volume
        source: prometheus_data
        target: /prometheus
        volume: {}
  restic-backup:
    container_name: restic-backup
    environment:
      BACKUP_CRON: 0 3 * * *
      RESTIC_BACKUP_ARGS: |
        --exclude '/host_home/*/.cache' --exclude '/host_root/.cache' --exclude '/stack_repo/**/.git' --exclude '/srv/docker-vols/**/cache' --exclude '/srv/docker-vols/**/tmp' --exclude '/docker_vols/*/_data/tmp' --exclude '/docker_vols/*/_data/cache' # Optional: Frigate recordings can be massive; uncomment to skip --exclude '/host_home/nghia-phan/git/nuc-docker-stack/frigate/storage/**'
      RESTIC_BACKUP_SOURCES: /host_etc /host_root /host_home /stack_repo /srv/docker-vols /docker_vols
      RESTIC_FORGET_ARGS: --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
      RESTIC_PASSWORD: Z8jL9/AKOQWnTp/RrYkawJy6vUlMHvujts6TCafvDRKDFXyeDwQk1utT+7h8miGK
      RESTIC_REPOSITORY: sftp:nuc_backup@192.168.50.232:/backups/nuc
      TZ: Europe/Paris
    hostname: restic
    image: ghcr.io/lobaro/restic-backup-docker:latest
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/nghia-phan/git/nuc-docker-stack/restic/ssh
        target: /root/.ssh
        bind:
          create_host_path: true
      - type: bind
        source: /home/nghia-phan/git/nuc-docker-stack/restic/restic.env
        target: /host/restic.env
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /etc
        target: /host_etc
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /root
        target: /host_root
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /home
        target: /host_home
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /home/nghia-phan/git/nuc-docker-stack
        target: /stack_repo
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /srv/docker-vols
        target: /srv/docker-vols
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /var/lib/docker/volumes
        target: /docker_vols
        read_only: true
        bind:
          create_host_path: true
  ring-mqtt:
    container_name: ring-mqtt
    environment:
      LIVESTREAM_PASS: go2rtc
      LIVESTREAM_USER: go2rtc
      MQTT_URL: mqtt://mosquito:mosquito@192.168.50.125:1883
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - nc -z localhost 8554
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 30s
    image: tsightler/ring-mqtt:latest
    networks:
      cctv_net: null
      default: null
    ports:
      - mode: ingress
        target: 8554
        published: "8558"
        protocol: tcp
      - mode: ingress
        target: 55123
        published: "55123"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /home/nghia-phan/git/nuc-docker-stack/ring-mqtt/data
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: true
networks:
  cctv_net:
    name: nuc-docker-stack_cctv_net
  default:
    name: nuc-docker-stack_default
volumes:
  grafana_data:
    name: nuc-docker-stack_grafana_data
  prometheus_data:
    name: nuc-docker-stack_prometheus_data
