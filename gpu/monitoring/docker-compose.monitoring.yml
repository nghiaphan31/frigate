services:
  victoria-metrics:
    container_name: victoria-metrics
    image: victoriametrics/victoria-metrics:v1.103.0
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/victoria-metrics-data
      - ./scrape.yml:/etc/victoriametrics/scrape.yml:ro
    command:
      - -storageDataPath=/victoria-metrics-data
      - -promscrape.config=/etc/victoriametrics/scrape.yml
      - -retentionPeriod=30d
      - -memory.allowedPercent=60
    extra_hosts:
      - "host-gateway:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(mnt/nas|media|proc|sys|dev|host|etc)($$|/)
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

  nvidia-gpu-exporter:
    container_name: nvidia-gpu-exporter
    image: utkuozdemir/nvidia_gpu_exporter:1.3.1
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    ports:
      - "9835:9835"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --disable_metrics=disk,tcp,udp,percpu,sched,process
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

volumes:
  vmdata:
